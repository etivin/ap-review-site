name: Deploy to GitHub Pages

# Deploys the site (static HTML/CSS/JS, no Jekyll) to GitHub Pages via
# GitHub Actions. Replaces the classic "deploy from a branch" builder, which
# had stalled and stopped publishing new commits.

on:
  push:
    branches: [main]
  workflow_dispatch:

# actions: read lets deploy-pages look up the uploaded artifact.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Dedicated group (away from the old stuck "pages" runs). Do NOT cancel in
# progress; let a run finish instead of newer runs killing it mid-deploy.
concurrency:
  group: pages-actions-deploy
  cancel-in-progress: false

# Two jobs: on 2026-11-23 a single job kept failing with "No artifacts named
# github-pages were found" right after a successful upload. A separate deploy
# job only starts once the upload is fully stored.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # enablement: true flips Pages to the "GitHub Actions" source if it is
      # still set to branch-based building, so no manual settings change is needed.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # v4+ leaves dotfiles (.claude/, .github/) out of the site, which is fine.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The upload is about 290 MB; 600000 ms (10 minutes) is the most the action allows.
          timeout: 600000
