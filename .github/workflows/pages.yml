name: Deploy to GitHub Pages

# Deploys the site (static HTML/CSS/JS, no Jekyll) to GitHub Pages via
# GitHub Actions. Replaces the classic "deploy from a branch" builder, which
# had stalled and stopped publishing new commits.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Dedicated group (away from the old stuck "pages" runs). Do NOT cancel in
# progress; let a run finish instead of newer runs killing it mid-deploy.
concurrency:
  group: pages-actions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Current majors (Node 24). On 2026-11-23 deploy-pages@v4 stopped finding
      # the artifact from upload-pages-artifact@v3, so keep these two in step.
      - name: Checkout
        uses: actions/checkout@v5

      # enablement: true flips Pages to the "GitHub Actions" source if it is
      # still set to branch-based building, so no manual settings change is needed.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # v4+ leaves dotfiles (.claude/, .github/) out of the site, which is fine.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The upload is about 290 MB; 600000 ms (10 minutes) is the most the action allows.
          timeout: 600000
