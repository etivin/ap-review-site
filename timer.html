<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#1a1a12"/>
<title>Study Timer — AP World History</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a12;--ink2:#26261c;--cream:#f9f6ef;--red:#e23a52;--red-d:#b0001c;
  --gold:#d4b84a;--muted:rgba(249,246,239,.42);--line:rgba(249,246,239,.12)
}
html,body{height:100%}
body{
  background:var(--ink);color:var(--cream);
  font-family:Lato,system-ui,sans-serif;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 24px);
  text-align:center;overflow:hidden;-webkit-font-smoothing:antialiased
}
.badge{
  font-family:Lato,system-ui,sans-serif;font-weight:700;font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--cream);background:var(--red-d);padding:5px 13px;margin-bottom:auto
}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%}
.ring-wrap{position:relative;width:min(78vw,340px);height:min(78vw,340px);margin:10px 0}
svg.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:8}
.ring-fg{fill:none;stroke:var(--red);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .4s}
.readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#clock{font-family:Lato,system-ui,sans-serif;letter-spacing:-.02em;font-weight:900;font-size:clamp(2.8rem,17vw,4.6rem);line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
#sublabel{font-family:Lato,system-ui,sans-serif;font-weight:700;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.headline{font-family:Lato,system-ui,sans-serif;letter-spacing:-.02em;font-weight:700;font-size:clamp(1.3rem,6vw,1.9rem);line-height:1.15;max-width:15ch}
.msg{color:var(--muted);font-size:.95rem;line-height:1.55;max-width:26ch;margin-top:2px}
.foot{margin-top:auto;padding-top:18px;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.btn{
  font-family:Lato,system-ui,sans-serif;font-weight:700;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
  background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;
  padding:11px 22px;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent
}
.btn:hover,.btn:active{color:var(--cream);border-color:var(--cream)}
.btn.primary{background:var(--red-d);color:var(--cream);border-color:var(--red-d);font-size:.8rem;padding:15px 34px}
.btn.primary:hover,.btn.primary:active{background:var(--red);border-color:var(--red)}
.hint{font-family:Lato,system-ui,sans-serif;font-weight:700;font-size:.58rem;letter-spacing:.1em;color:var(--muted)}
/* done state */
body.done{background:var(--red-d)}
body.done .ring-fg{stroke:var(--gold)}
body.done .badge{background:#0000;border:1px solid var(--cream)}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.hidden{display:none!important}
</style>
</head>
<body>
  <div class="badge">AP World History &bull; Focus</div>

  <!-- START SCREEN (shown briefly / if autoplay blocked) -->
  <div class="stage" id="startScreen">
    <div class="headline">Ready to lock in?</div>
    <p class="msg" id="startMsg">Your study session is set. Tap start, then put your phone face-down and get to work.</p>
    <div class="foot">
      <button class="btn primary" id="startBtn">Start <span id="startDur"></span></button>
      <div class="hint">The timer will ring when your time is up.</div>
    </div>
  </div>

  <!-- RUNNING / TIMER SCREEN -->
  <div class="stage hidden" id="runScreen">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="54"></circle>
        <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="readout">
        <div id="clock">00:00</div>
        <div id="sublabel">remaining</div>
      </div>
    </div>
    <div class="headline" id="runHeadline">Phone down. Eyes on the work.</div>
    <p class="msg" id="runMsg">Come back when the timer rings.</p>
    <div class="foot">
      <button class="btn" id="giveupBtn">End early</button>
    </div>
  </div>

  <script src="qrcode.min.js"></script>
  <script>
  (function(){
    "use strict";
    var qs = new URLSearchParams(location.search);
    // minutes (?m=) with optional seconds (?s=); default 25
    var mins = parseInt(qs.get('m'), 10);
    var secs = parseInt(qs.get('s'), 10);
    if (isNaN(mins) || mins < 0) mins = 25;
    if (isNaN(secs) || secs < 0) secs = 0;
    var totalMs = (mins * 60 + secs) * 1000;
    if (totalMs <= 0) totalMs = 25 * 60 * 1000;

    // a stable key so a screen-lock + reopen resumes the SAME session (not a fresh one)
    var SKEY = 'apwh-timer-' + totalMs;
    var C = 2 * Math.PI * 54; // ring circumference

    var el = function(id){ return document.getElementById(id); };
    var startScreen = el('startScreen'), runScreen = el('runScreen');
    var clock = el('clock'), sub = el('sublabel'), ringFg = el('ringFg');
    var runHeadline = el('runHeadline'), runMsg = el('runMsg');

    ringFg.style.strokeDasharray = C;
    ringFg.style.strokeDashoffset = 0;

    function human(ms){
      var t = Math.max(0, Math.round(ms/1000));
      var h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
      var pad = function(n){ return (n<10?'0':'')+n; };
      return h>0 ? h+':'+pad(m)+':'+pad(s) : pad(m)+':'+pad(s);
    }
    function durWords(ms){
      var m = Math.round(ms/60000);
      if (m >= 60 && m % 60 === 0) return (m/60) + (m/60===1?' hour':' hours');
      return m + ' min';
    }
    el('startDur').textContent = '– ' + durWords(totalMs);

    var endTime = null, tick = null, wakeLock = null;

    // ---- keep the screen awake so the countdown stays visible ----
    async function requestWake(){
      try{
        if ('wakeLock' in navigator){
          wakeLock = await navigator.wakeLock.request('screen');
        }
      }catch(e){/* not supported / denied — timer still runs */}
    }
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible'){
        if (endTime && !document.body.classList.contains('done')) requestWake();
        render(); // recompute against the real clock after being backgrounded
      }
    });

    function beep(){
      try{
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        var ctx = new Ctx();
        var seq = [0, .6, 1.2];
        seq.forEach(function(when){
          var o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine'; o.frequency.value = 880;
          o.connect(g); g.connect(ctx.destination);
          var t0 = ctx.currentTime + when;
          g.gain.setValueAtTime(0, t0);
          g.gain.linearRampToValueAtTime(.5, t0 + .04);
          g.gain.exponentialRampToValueAtTime(.0001, t0 + .5);
          o.start(t0); o.stop(t0 + .52);
        });
      }catch(e){}
    }
    function buzz(){ try{ if (navigator.vibrate) navigator.vibrate([400,150,400,150,600]); }catch(e){} }

    function render(){
      if (!endTime) return;
      var remaining = endTime - Date.now();
      if (remaining <= 0){ finish(); return; }
      clock.textContent = human(remaining);
      var frac = remaining / totalMs;            // 1 -> 0
      ringFg.style.strokeDashoffset = C * (1 - frac); // ring empties as time runs out
    }

    function start(){
      // resume an in-progress session if one exists and is still in the future
      var saved = parseInt(localStorage.getItem(SKEY), 10);
      if (!isNaN(saved) && saved - Date.now() > 0){
        endTime = saved;
      } else {
        endTime = Date.now() + totalMs;
        try{ localStorage.setItem(SKEY, String(endTime)); }catch(e){}
      }
      startScreen.classList.add('hidden');
      runScreen.classList.remove('hidden');
      document.body.classList.remove('done');
      requestWake();
      render();
      clearInterval(tick);
      tick = setInterval(render, 250);
    }

    function stopClocks(){
      clearInterval(tick); tick = null;
      try{ if (wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
      try{ localStorage.removeItem(SKEY); }catch(e){}
    }

    function finish(){
      stopClocks();
      endTime = null;
      document.body.classList.add('done');
      clock.textContent = "00:00";
      ringFg.style.strokeDashoffset = 0; // ring shown full = block complete
      sub.textContent = "time's up";
      runHeadline.textContent = "Time's up — great work.";
      runHeadline.classList.add('pulse');
      runMsg.textContent = "Head back to the laptop. Set another block when you're ready.";
      el('giveupBtn').textContent = 'Start another block';
      beep(); buzz();
    }

    function endEarly(){
      if (document.body.classList.contains('done')){
        // "start another block" -> back to the laptop hub
        location.href = 'index.html';
        return;
      }
      if (!confirm('End this study block early?')) return;
      stopClocks();
      finish(); // treat as done so the encouraging screen shows
    }

    el('startBtn').addEventListener('click', start);
    el('giveupBtn').addEventListener('click', endEarly);

    // If a matching session is already running (they re-scanned / reopened), skip the start screen.
    var already = parseInt(localStorage.getItem(SKEY), 10);
    if (!isNaN(already) && already - Date.now() > 0){
      start();
    }
  })();
  </script>
</body>
</html>
