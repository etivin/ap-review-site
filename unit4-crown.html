<style>
:root{
  /* the Tivin Teaches palette from brand.css (navy, brand blue, logo gold), light in both site themes */
  --g-bg:#eef3fa;--g-card:#ffffff;--g-line:#cfdcec;--g-text:#16244d;--g-dim:#66748f;
  --g-amber:#b8860b;--g-gold:#f4cd4f;--g-blue:#345fbf;--g-green:#1a8a4a;--g-red:#cc3d3d;
  --g-shadow:0 1px 4px rgba(22,36,77,.10),0 8px 26px rgba(22,36,77,.10)
}
*{box-sizing:border-box}
body{margin:0;background:var(--g-bg);color:var(--g-text);font:16px/1.5 'Lato',-apple-system,'Segoe UI',sans-serif}
.hidden{display:none!important}
#shell{position:fixed;inset:0;z-index:1000;background:var(--g-bg);color:var(--g-text);display:flex;flex-direction:column}
/* the site's top bar: brand.js puts the Tivin Teaches lockup in .bar .brand */
#shell .bar{display:flex;align-items:center;gap:14px;min-height:0;padding:8px 18px;background:#16244d;color:#fff;box-shadow:0 2px 0 var(--g-blue);flex-shrink:0;z-index:2}
#shell .bar .brand{text-decoration:none;color:#fff;flex-shrink:0}
#shell .tivin-emblem{--em:46px!important}
#shell .tivin-wordmark b{font-size:1.05rem}
#shell .tivin-wordmark i{font-size:.52rem;margin-top:3px}
.top .ttl{font:900 1.15rem 'Lato',sans-serif;color:#fff;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid rgba(255,255,255,.25);padding-left:14px}
.top .ttl small{display:block;font:700 .62rem 'Lato',sans-serif;color:var(--g-gold);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.hud{display:flex;gap:8px;white-space:nowrap}
.hud span{background:rgba(255,255,255,.1);border:1px solid rgba(244,205,79,.55);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.92rem;color:#fff}
.hud b{color:var(--g-gold);font-weight:900}
.top a.nav,.top button{font:700 .7rem 'Lato',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:transparent;border:0;border-bottom:2px solid transparent;padding:6px 2px;text-decoration:none;cursor:pointer;white-space:nowrap}
.top a.nav:hover,.top button:hover{color:var(--g-gold);border-bottom-color:var(--g-gold)}
.stage{position:relative;height:21vh;min-height:120px;max-height:210px;flex-shrink:0;overflow:hidden;background:#cfe7ff}
#scene{display:block;width:100%;height:100%}
.low{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr)}
.low.full{grid-template-columns:minmax(0,1fr)}
.low.full .status{display:none}
.status{padding:16px;overflow-y:auto;background:#fbf8f1;border-right:1px solid var(--g-line);display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.tile{background:var(--g-card);border-radius:14px;padding:10px 12px;box-shadow:var(--g-shadow)}
.tile.wide{grid-column:1/-1}
.tile span{display:block;font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--g-dim)}
.tile b{display:block;font-size:1.35rem;font-weight:900;line-height:1.2;color:var(--g-text)}
.tile b.ok{color:var(--g-green)}.tile b.lo{color:var(--g-red)}.tile b.mid{color:var(--g-amber)}.tile b.gold{color:var(--g-amber)}
.meter{height:8px;border-radius:99px;background:#efe7d6;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.panel{padding:22px 28px 30px;overflow-y:auto}
.panel.anim > *{animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.say{font-size:1.08rem;line-height:1.55;margin:0 0 14px;max-width:860px}
.say b{color:var(--g-amber);font-weight:900}
.say.dim{font-size:.95rem;color:var(--g-dim)}
h2{font:900 1.6rem 'Lato',sans-serif;color:var(--g-text);margin:0 0 10px;letter-spacing:-.02em}
h3{font-size:.62rem;font-weight:700;color:var(--g-blue);margin:22px 0 10px;letter-spacing:.3em;text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px;max-width:620px}
.mi{font:700 1rem 'Lato',sans-serif;text-align:left;background:var(--g-blue);color:#fff;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 14px rgba(31,78,168,.25);transition:transform .12s,box-shadow .12s,background .12s}
.mi:hover:not(:disabled),.mi:focus-visible{transform:translateY(-1px);box-shadow:0 8px 20px rgba(52,95,191,.32);background:#26489c;outline:none}
.mi:disabled{opacity:.4;cursor:default;box-shadow:none}
.mi .k{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;background:rgba(255,255,255,.22);font-size:.8rem;margin-right:10px}
.mi small{font-weight:400;opacity:.85;margin-left:8px;font-size:.88rem}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:1000px}
.card{position:relative;border:2px solid transparent;border-radius:16px;padding:14px 16px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--g-card);color:var(--g-text);text-align:left;font:inherit;box-shadow:var(--g-shadow);transition:transform .12s,border-color .12s,box-shadow .12s}
.card:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 26px rgba(60,45,10,.14)}
.card.on{border-color:var(--g-gold);background:#fffbea;box-shadow:0 0 0 4px rgba(244,205,79,.3),var(--g-shadow)}
.card.on::after{content:'\2713';position:absolute;top:12px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--g-gold);color:#fff;font-weight:900;text-align:center;line-height:26px}
.card:disabled{opacity:.45;cursor:default}
.card b{font-weight:900;font-size:1.05rem;color:var(--g-text);padding-right:30px}
.card .cost{align-self:flex-start;font-size:.8rem;font-weight:900;color:var(--g-amber);background:#fff5dc;border-radius:999px;padding:2px 10px}
.card .fx{display:flex;flex-wrap:wrap;gap:5px}
.card .fx span{font-size:.76rem;font-weight:700;color:var(--g-green);background:#e9f7ef;border-radius:999px;padding:2px 9px}
.card .fx span.neg{color:var(--g-red);background:#fdeeee}
.card .txt{font-size:.86rem;line-height:1.45;color:var(--g-dim)}
.gopts{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px;max-width:760px}
.gopt{font:600 .98rem 'Lato',sans-serif;text-align:left;background:var(--g-card);color:var(--g-text);border:2px solid var(--g-line);border-radius:12px;padding:11px 14px;cursor:pointer;transition:border-color .12s,background .12s}
.gopt:hover:not(:disabled){border-color:var(--g-blue);background:#f4f7fe}
.gopt.right{border-color:var(--g-green);background:#e9f7ef;color:#14663a}
.gopt.wrong{border-color:var(--g-red);background:#fdeeee;color:#9c2b2b}
.gopt:disabled{cursor:default}
.note{font-size:.92rem;line-height:1.55;background:var(--g-card);border-left:4px solid var(--g-gold);border-radius:0 12px 12px 0;padding:10px 14px;margin:0 0 12px;max-width:860px;box-shadow:var(--g-shadow)}
.note.good{border-left-color:var(--g-green)}
.note.bad{border-left-color:var(--g-red);background:#fff8f8}
.mlist{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px}
.mcard{background:var(--g-card);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--g-shadow);border-top:6px solid var(--g-blue)}
.mcard:nth-child(2){border-top-color:#16244d}.mcard:nth-child(3){border-top-color:var(--g-gold)}
.mcard b{font:900 1.35rem 'Lato',sans-serif;letter-spacing:-.02em;color:var(--g-text)}
.mcard span{color:var(--g-dim);font-size:.82rem;font-weight:700}
.mcard p{font-size:.9rem;margin:0;flex:1;color:var(--g-dim)}
.gb{font:900 .82rem 'Lato',sans-serif;letter-spacing:.06em;text-transform:uppercase;background:var(--g-blue);color:#fff;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(31,78,168,.25);transition:transform .12s}
.gb:hover:not(:disabled){transform:translateY(-1px)}
.gb:disabled{opacity:.4;cursor:default}
table.sum{border-collapse:separate;border-spacing:0;width:100%;max-width:640px;font-size:.98rem;margin:4px 0 14px;background:var(--g-card);border-radius:14px;overflow:hidden;box-shadow:var(--g-shadow)}
table.sum td{padding:10px 16px;border-bottom:1px solid #f1ead9}
table.sum td:last-child{text-align:right;white-space:nowrap;font-weight:900}
table.sum .pos{color:var(--g-green)}
table.sum .neg{color:var(--g-red)}
table.sum tr.tot td{background:#fff8e6;color:var(--g-amber);font-weight:900;border-bottom:0}
@media(max-width:800px){
  .stage{height:17vh;min-height:110px}
  .low{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .status{border-right:0;border-bottom:1px solid var(--g-line);grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
  .tile{padding:6px 8px;border-radius:10px}
  .tile b{font-size:1rem}
  .tile small{display:none!important}
  .tile span{font-size:.6rem}
  .tile.wide{grid-column:span 2}
  .panel{padding:16px}
  .cards,.mlist{grid-template-columns:1fr}
  .top .ttl small{display:none}
  #shell .tivin-wordmark{display:none}
  #shell .tivin-emblem{--em:38px!important}
  .top .ttl{flex:1 1 auto;border-left:0;padding-left:0;font-size:1rem}
  .top .ttl small{display:none}
  #shell .bar{flex-wrap:wrap;gap:8px 12px;padding:8px 12px}
}
</style>

<script>
/* Crown & Coffers: rule a crown from 1600 to 1700 with mercantilist policies.
   Each decade: enact 2 of 4 POLICIES, face one EVENT, answer one QUESTION, then the
   decade's trade is tallied (exports - imports + silver + company dividends - smuggling).
   fx keys: exports, imports, colonies, navy, unrest, companies, gold (one-time), war, silver.
   QUESTIONS list the key first and are shuffled when shown; the key is never the longest. */
var CROWNS = [
  { id:'england', name:'England', ruler:'James I', blurb:'An island kingdom with a growing navy and a few struggling colonies. Build trade and sea power.',
    gold:90, exports:40, imports:48, colonies:1, navy:2, unrest:10, companies:0, silver:0 },
  { id:'france', name:'France', ruler:'Henry IV', blurb:'The largest kingdom in Western Europe, rich in farmland but weak in trade, with one young colony in New France. Build industry and colonies.',
    gold:110, exports:40, imports:48, colonies:1, navy:1, unrest:5, companies:0, silver:0 },
  { id:'spain', name:'Spain', ruler:'Philip III', blurb:'The richest empire in the world, with silver from the Americas. But the silver keeps flowing out to buy foreign goods.',
    gold:130, exports:28, imports:62, colonies:4, navy:2, unrest:25, companies:0, silver:40 },
  { id:'dutch', name:'The Dutch Republic', ruler:'Maurice of Nassau', blurb:'A small republic of merchants and bankers with the biggest merchant fleet in Europe. It must import its grain and timber, and has no silver mines or colonies yet: win by out-trading everyone.',
    gold:80, exports:44, imports:54, colonies:0, navy:2, unrest:0, companies:1, silver:0 },
  { id:'portugal', name:'Portugal', ruler:'the Portuguese crown', blurb:'The first sea empire: forts from Africa to India and sugar in Brazil. But it is a small country stretched thin, and ruled by Spain&rsquo;s king until 1640.',
    gold:110, exports:39, imports:46, colonies:3, navy:2, unrest:15, companies:0, silver:0 }
];

var POLICIES = [
  { id:'colony', name:'Found a colony', cost:40, max:4, fx:{ colonies:1, exports:6, imports:-6, unrest:5 },
    txt:'Settlers clear land for tobacco, timber and furs, and buy cloth and tools from home.',
    ap:'Colonies supplied raw materials and served as captive markets for the home country&rsquo;s finished goods.' },
  { id:'sugar', name:'Plant a Caribbean sugar colony', cost:50, max:2, fx:{ colonies:1, exports:14, unrest:5 }, human:true,
    txt:'Sugar was the most valuable crop of the age.',
    ap:'Caribbean sugar plantations were worked by enslaved Africans brought across the Atlantic. The wealth came at a terrible human cost.' },
  { id:'company', name:'Charter a joint-stock company', cost:30, max:2, fx:{ companies:1, exports:6 },
    txt:'Investors buy shares and split the risk of long voyages to Asia. Pays a dividend every decade.',
    ap:'Joint-stock companies like the English East India Company (1600) and the Dutch VOC (1602) pooled money from many investors and shared the risk.' },
  { id:'navacts', name:'Pass Navigation Acts', cost:10, max:1, only:'england', fx:{ exports:10, unrest:15 },

/* ── a decade: policies ── */
var hand = [], picked = [];
function allowed(p){

  return (G.used[p.id] || 0) < p.max;
}

}
function fxText(p){

/* ── a decade: the event ── */

      tween(250, function(t){ f.setAttribute('opacity', 1 - t); }, function(){ f.remove(); });
      var p = el('circle', { cx:x, cy:y, r:6, fill:'#e8e8ee' }, $('fx'));
      tween(1400, function(t){ p.setAttribute('r', 6 + 22 * t); p.setAttribute('cy', y - 20 * t); p.setAttribute('opacity', .9 * (1 - t)); }, function(){ p.remove(); });
    }, delay);
  }
  if (id === 'pirates' || id === 'treasure') {
    cross(id === 'pirates' ? '#222' : '#f6e7b0', id === 'pirates' ? '#111' : '#c0392b', R, L, 7000);
  } else if (id === 'war' || id === 'postwar') {
    var a = cross('#fffaf0', '#1f4ea8', 580, 600, 4200, 246), b = cross('#fffaf0', '#c0392b', 660, 640, 4200, 246);
    for (var i = 0; i < 7; i++) { smoke(620 + (i % 2 ? 50 : 0), 228, 300 + i * 450); }
  } else if (id === 'hurricane' || id === 'plague' || id === 'harvest') {
    var dim = $('dim'); tween(500, function(t){ dim.setAttribute('opacity', .35 * t); });
    var cloud = el('g', {}, $('fx'));
    el('ellipse', { cx:500, cy:70, rx:120, ry:30, fill:'#5b6b82' }, cloud); el('ellipse', { cx:450, cy:60, rx:60, ry:26, fill:'#6d7d94' }, cloud); el('ellipse', { cx:560, cy:58, rx:70, ry:28, fill:'#6d7d94' }, cloud);
    var drops = [];
    for (var d = 0; d < 26; d++) drops.push(el('line', { x1:0, y1:0, x2:-4, y2:12, stroke:'#cfe0f5', 'stroke-width':2 }, cloud));
    tween(3200, function(t){
      drops.forEach(function(r, j){ var x = 400 + (j * 37) % 200, y = 90 + ((t * 2600 + j * 47) % 140); r.setAttribute('transform', 'translate(' + x + ',' + y + ')'); });
      cloud.setAttribute('opacity', t < .8 ? 1 : 1 - (t - .8) / .2);
    }, function(){ cloud.remove(); tween(600, function(t){ dim.setAttribute('opacity', .35 * (1 - t)); }); });
  } else if (id === 'ship' || id === 'dowry' || id === 'huguenots') {
    cross('#fffaf0', '#f4cd4f', R, 640, 3200);
  } else if (id === 'strike' || id === 'bubble') {
    for (var k = 0; k < 10; k++) (function(k){ var s = el('path', { d:'M0 -8 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2z', fill:'#fff3a0', transform:'translate(' + (440 + Math.random() * 120) + ',' + (140 + Math.random() * 60) + ')' }, $('fx'));
      tween(900, function(t){ s.setAttribute('opacity', Math.sin(t * Math.PI)); }, function(){ s.remove(); }, k * 120); })(k);
  }
}

var prev = null;
function resetScene(){ prev = null; $('fx').innerHTML = ''; $('sea').innerHTML = ''; }
function updateScene(){
  var bal = G ? balance() : -8, ex = G ? G.exports : 40, im = G ? G.imports : 48;
  var ang = Math.max(-12, Math.min(12, -bal / 3)), dy = 110 * Math.sin(ang * Math.PI / 180);
  $('beam').style.transform = 'rotate(' + ang + 'deg)';
  $('panL').style.transform = 'translateY(' + (-dy).toFixed(1) + 'px)';
  $('panR').style.transform = 'translateY(' + dy.toFixed(1) + 'px)';
  $('tExp').textContent = 'EXPORTS ' + ex; $('tImp').textContent = 'IMPORTS ' + im;
  [['stackL', ex, 720, '#2fa866'], ['stackR', im, 940, '#d94b4b']].forEach(function(s){
    var g = $(s[0]); g.innerHTML = ''; var n = Math.min(9, Math.round(s[1] / 12));
    for (var i = 0; i < n; i++) el('rect', { x:s[2] - 27 + (i % 3) * 19, y:150 - Math.floor(i / 3) * 12, width:16, height:10, rx:2, fill:s[3], stroke:'#fff', 'stroke-width':1.5 }, g);
  });
  var tb = $('tBal');
  tb.textContent = G ? (bal >= 0 ? 'FAVORABLE BALANCE ' : 'UNFAVORABLE BALANCE ') + sgn(bal) : 'THE BALANCE OF TRADE';
  tb.setAttribute('fill', !G ? '#16244d' : bal >= 0 ? '#1a8a4a' : '#cc3d3d');
  $('tGold').textContent = 'TREASURY' + (G ? ' ' + G.gold + ' GOLD' : '');
  /* coins heaped on the chest: one coin for every 15 gold */
  var want = G ? Math.max(0, Math.min(45, Math.round(G.gold / 15))) : 12, cg = $('coins');
  while (cg.childNodes.length > want) cg.removeChild(cg.lastChild);
  for (var c = cg.childNodes.length; c < want; c++) {
    var row = 0, left = c; while (left >= 9 - row && row < 6) { left -= 9 - row; row++; }
    el('ellipse', { 'class':'coin', cx:500 - (8 - row) * 7 + left * 14 + (row % 2) * 3, cy:176 - row * 7, rx:9, ry:4, fill:'url(#gCoin)', stroke:'#b8860b', 'stroke-width':1, style:'animation-delay:' + (c * 0.03) + 's' }, cg);
  }
  /* ships in the harbor (new ones sail in) and colony flags on the hills (new ones pop up) */
  var ships = G ? Math.min(6, G.navy + G.companies) : 3, sg = $('ships');
  var oldShips = prev ? prev.ships : ships, oldFlags = prev ? prev.flags : (G ? G.colonies : 0);
  sg.innerHTML = '';
  for (var i = 0; i < ships; i++) {
    var war = G ? i < G.navy : i < 2, s = makeShip(sg, 36 + i * 48, 238, '#fffaf0', war ? '#cc3d3d' : '#345fbf');
    s.style.animationDelay = (i * 0.3) + 's';
    if (i >= oldShips) { var w = el('g', { 'class':'sailin' }, sg); w.appendChild(s); }
  }
  var flags = G ? Math.min(9, G.colonies) : 0, fg = $('flags'); fg.innerHTML = '';
  for (var f = 0; f < flags; f++) {
    var fx = 40 + f * 30, fy = 200 + (f % 2) * 6, holder = el('g', { 'class':f >= oldFlags ? 'pop' : '', style:'transform-box:fill-box;transform-origin:center bottom' }, fg);
    el('rect', { x:fx, y:fy - 22, width:2, height:24, fill:'#6b431f' }, holder);
    el('path', { 'class':'flag', d:'M' + (fx + 2) + ' ' + (fy - 22) + ' h14 l-4 5 l4 5 h-14 z', fill:'#f4cd4f', style:'animation-delay:' + (f * 0.2) + 's' }, holder);
  }
  $('tFleet').textContent = G ? 'COLONIES ' + G.colonies + '  ·  SHIPS ' + ships : 'YOUR HARBOR';
  /* coins fly when the treasury changes */
  if (G && prev && prev.gold !== G.gold) coinsFly(G.gold - prev.gold);
  prev = G ? { gold:G.gold, ships:ships, flags:flags } : null;
}
/* the picture never crops: wide screens get more sky and sea, with the harbor and the scale moving to the edges */
function fit(){
  var r = $('scene').getBoundingClientRect(); if (!r.width || !r.height) return;
  var top = 20, H = 280, a = r.width / r.height, vb;
  if (a >= 1000 / H) { var w = H * a; vb = [-(w - 1000) / 2, top, w, H]; }
  else { var h = 1000 / a; vb = [0, top + H - h, 1000, h]; }
  VB = { x:vb[0], w:vb[2] };
  $('scene').setAttribute('viewBox', vb.map(function(v){ return v.toFixed(1); }).join(' '));
  var spread = Math.min(260, Math.max(0, -vb[0] - 40));
  $('leftG').setAttribute('transform', 'translate(' + (-spread) + ',0)');
  $('rightG').setAttribute('transform', 'translate(' + spread + ',0)');
}
window.addEventListener('resize', fit);
fit(); updateScene();
title();
</script>
