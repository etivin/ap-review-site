<title>Unit 4 Fit Out the Fleet</title>
<meta name="description" content="Outfit a fleet with the technology of the age of exploration, then keep your crew alive day by day on the voyage.">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  /* the game keeps its own night-sea palette in both themes */
  --g-bg:#0b1430;--g-line:#6d84d4;--g-text:#f2e6c8;--g-dim:#c3cbe8;--g-amber:#f5b942;--g-green:#7fd67f;--g-red:#ff7a6b
}
*{box-sizing:border-box}
body{margin:0;background:var(--g-bg);color:var(--g-text);font:16px/1.5 'Lato',-apple-system,'Segoe UI',sans-serif}
.hidden{display:none!important}

/* the whole game fills the window */
#shell{position:fixed;inset:0;z-index:1000;background:var(--g-bg);color:var(--g-text);font-family:'VT323',monospace;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:6px 14px;border-bottom:2px solid var(--g-line);flex-shrink:0}
.top .ttl{font-size:26px;color:var(--g-amber);letter-spacing:.04em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{color:var(--g-dim);font-size:18px;margin-left:10px}
.hud{display:flex;gap:18px;font-size:24px;white-space:nowrap}
.hud span{border:2px solid var(--g-amber);padding:0 10px;color:var(--g-text)}
.hud b{color:var(--g-amber);font-weight:normal}
.top a,.top button{font:20px 'VT323',monospace;color:var(--g-text);background:transparent;border:2px solid var(--g-line);padding:2px 10px;text-decoration:none;cursor:pointer;white-space:nowrap}
.top a:hover,.top button:hover{border-color:var(--g-text)}
.stage{position:relative;height:44vh;min-height:200px;flex-shrink:0;background:#7fb4e6}
#scene{display:block;width:100%;height:100%;image-rendering:pixelated}
#scene.fishing{cursor:crosshair}
.route{position:relative;height:30px;margin:0 22px;border-bottom:2px dashed var(--g-line);flex-shrink:0}
.route .dot{position:absolute;bottom:-7px;width:12px;height:12px;margin-left:-6px;background:var(--g-bg);border:2px solid var(--g-dim)}
.route .dot.port{border-color:var(--g-amber)}
.route .dot.past{background:var(--g-dim)}
.route .dot.end{border-color:var(--g-green);width:14px;height:14px;margin-left:-7px;bottom:-8px}
.route .me{position:absolute;bottom:3px;font-size:20px;transform:translateX(-50%);transition:left .25s linear;line-height:1}
.low{flex:1;min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr)}
.status{border-right:2px solid var(--g-line);padding:10px 16px;overflow-y:auto}
.status p{margin:0 0 4px;font-size:22px;line-height:1.15;display:flex;justify-content:space-between;gap:10px}
.status span{color:var(--g-dim)}
.techbox{margin:6px 0 8px;padding:6px 0;border-top:1px dashed var(--g-line);border-bottom:1px dashed var(--g-line);display:flex;flex-direction:column;gap:2px;font-size:20px}
.techbox span{color:var(--g-dim);font-size:18px;text-transform:uppercase;letter-spacing:.06em}
.techbox b{font-weight:normal;color:var(--g-green)}
.techbox i{font-style:normal;color:var(--g-dim)}
.status .lo{color:var(--g-red)}.status .ok{color:var(--g-green)}.status .mid{color:var(--g-amber)}
.panel{padding:14px 20px 20px;overflow-y:auto}
.full .low,.low.full{grid-template-columns:minmax(0,1fr)}
.low.full .status{display:none}
.say{font-size:26px;line-height:1.2;margin:0 0 12px}
.say b{color:var(--g-amber);font-weight:normal}
.say.dim{font-size:21px;color:var(--g-dim)}
h2{font-weight:normal;font-size:30px;color:var(--g-amber);margin:0 0 8px;letter-spacing:.03em}
h3{font-weight:normal;font-size:22px;color:var(--g-dim);margin:18px 0 6px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px dashed var(--g-line)}
.menu{display:flex;flex-direction:column;gap:2px;margin:0 0 10px;max-width:620px}
.mi{font:24px 'VT323',monospace;text-align:left;background:transparent;color:var(--g-text);border:0;padding:3px 8px;cursor:pointer;line-height:1.15}
.mi:hover:not(:disabled),.mi:focus-visible{background:var(--g-text);color:var(--g-bg);outline:none}
.mi:disabled{opacity:.35;cursor:default}
.mi .k{color:var(--g-amber);margin-right:8px}
.mi:hover .k{color:var(--g-bg)}
.mi small{color:var(--g-dim);font-size:19px;margin-left:8px}
.mi:hover small{color:var(--g-bg)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.gb{font:22px 'VT323',monospace;background:transparent;color:var(--g-text);border:2px solid var(--g-text);padding:3px 14px;cursor:pointer;line-height:1.2}
.gb:hover:not(:disabled){background:var(--g-text);color:var(--g-bg)}
.gb.main{border-color:var(--g-amber);color:var(--g-amber)}
.gb.main:hover:not(:disabled){background:var(--g-amber);color:var(--g-bg)}
.gb:disabled{opacity:.35;cursor:default}
.gopts{display:flex;flex-direction:column;gap:6px;margin:6px 0 12px;max-width:760px}
.gopt{font:22px 'VT323',monospace;text-align:left;background:transparent;color:var(--g-text);border:1px solid var(--g-line);padding:5px 10px;cursor:pointer;line-height:1.15}
.gopt:hover:not(:disabled){border-color:var(--g-text)}
.gopt.right{border-color:var(--g-green);color:var(--g-green)}
.gopt.wrong{border-color:var(--g-red);color:var(--g-red)}
.gopt:disabled{cursor:default}
.note{font-family:'Lato',sans-serif;font-size:.9rem;line-height:1.5;background:rgba(255,255,255,.06);border-left:4px solid var(--g-amber);padding:8px 11px;margin:0 0 12px;max-width:820px}
.note.good{border-left-color:var(--g-green)}
.note.bad{border-left-color:var(--g-red)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:6px 0;border-bottom:1px solid var(--g-line);font-size:22px;max-width:980px}
.row .nm small{display:block;font-family:'Lato',sans-serif;font-size:.8rem;color:var(--g-dim);line-height:1.35}
.row .pr{color:var(--g-amber);white-space:nowrap}
.row .ctl{display:flex;align-items:center;gap:6px}
.row .qty{min-width:80px;text-align:center}
.step{font:22px 'VT323',monospace;width:32px;height:32px;background:transparent;color:var(--g-text);border:2px solid var(--g-text);cursor:pointer;line-height:1}
.step:disabled{opacity:.3;cursor:default}
.bonus{grid-column:1/-1}
.mlist{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.mcard{border:2px solid var(--g-line);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.mcard b{font-weight:normal;font-size:26px;color:var(--g-amber)}
.mcard span{color:var(--g-dim);font-size:19px}
.mcard p{font-family:'Lato',sans-serif;font-size:.86rem;margin:0;flex:1}
.logbox{font-size:19px;color:var(--g-dim);border-top:1px dashed var(--g-line);margin-top:12px;padding-top:6px}
.logbox p{margin:0}
table.sum{border-collapse:collapse;width:100%;max-width:820px;font-size:21px;margin:8px 0}
table.sum td{padding:4px 6px;border-bottom:1px solid var(--g-line)}
table.sum td:last-child{text-align:right;color:var(--g-amber);white-space:nowrap}
.origins{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:8px 0 12px;max-width:1000px}
.origins div{border:1px solid var(--g-line);padding:7px 10px;font-family:'Lato',sans-serif;font-size:.84rem}
.origins b{display:block;color:var(--g-amber);font-family:'VT323',monospace;font-weight:normal;font-size:21px}
@media(max-width:800px){
  .stage{height:32vh}
  .low{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .status{border-right:0;border-bottom:2px solid var(--g-line);display:grid;grid-template-columns:1fr 1fr;gap:0 16px;padding:6px 14px}
  .status p{font-size:19px}
  .techbox{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;gap:2px 14px;font-size:18px}
  .techbox span{flex-basis:100%}
  .mlist{grid-template-columns:1fr}
  .top .ttl small{display:none}
  .hud{font-size:19px;gap:8px}
  .top{flex-wrap:wrap}
}
</style>

<script>

   list the key first and are shuffled when shown; the key is never the longest option. */
var ORIGINS = {
  china:'China',

  dutch:'The Dutch Republic'
};
var TECH = {
  compass:{ name:'Magnetic compass', cost:15, origin:'china', does:'Points north in any weather. Without it, fog sends you off course.',

  lateen:{ name:'Lateen sail', cost:12, origin:'arab', does:'Sails at an angle into the wind, so calms and headwinds stall you less.',

    note:'Developed in Han China; it was in use in Europe by about 1200, replacing the old steering oar.' },
  caravel:{ name:'Caravel hull', cost:20, origin:'port', does:'A small, fast, light ship for shallow coasts. A little faster every day.',
    note:'Portuguese shipbuilders of the 1400s designed it, combining lateen and square sails on a nimble hull.' },
  charts:{ name:'Portolan charts', cost:8, origin:'med', does:'Maps of coasts and harbors. Keeps you off reefs near land.',
    note:'Drawn by Italian and Catalan mapmakers from the 1200s for Mediterranean sailing. Great for coasts, little help in the open ocean.' },
  cannon:{ name:'Shipboard cannons', cost:20, origin:'china', does:'Heavy guns. Pirates and rivals keep their distance.',
    note:'Gunpowder was invented in China. By the 1400s European states were mounting heavy cannons on ships, which gave Portugal an edge in the Indian Ocean.' },
  winds:{ name:'Wind knowledge', cost:12, origin:'port', does:'Knowing where the great ocean winds blow. You sail 10% farther each day.',
    note:'Decades of Portuguese voyages into the Atlantic mapped its wind circles, like the volta do mar, and later sailors learned the westerlies of the southern oceans.' },
  pilot:{ name:'A local monsoon pilot', cost:15, origin:'arab', does:'An experienced navigator who knows the seasonal winds of the Indian Ocean.',
    note:'Gujarati, Arab and Swahili pilots had sailed the monsoon routes for centuries. Da Gama hired one at Malindi to reach India.' },
  fluyt:{ name:'Dutch fluyt', cost:18, origin:'dutch', does:'A cargo ship that needs a small crew, so provisions last longer.',
    note:'Designed in Holland around 1595, it made Dutch shipping the cheapest in Europe.' }
};
var BONUS = 5;

var MISSIONS = [
  { id:'gama', flag:'pt', name:'Around Africa to India', who:'Portugal, 1497', captain:'Vasco da Gama', start:[1497, 6, 8], crew:170, minCrew:95, budget:170,
    hist:{ days:316, text:'The real da Gama left Lisbon on July 8, 1497 and reached Calicut on May 20, 1498: 316 days. He lost about half his men, most of them to scurvy, before he got home.' },
    brief:['Winds and currents along the African coast that run against you','Months out of sight of land','Days of storm clouds at a stormy cape','Huge waves off the southeast coast of Africa','A sea crossing whose winds change with the season','Rivals in a crowded port who will not welcome you'],
    blurb:'King Manuel wants a sea route to the pepper of India. Sail down Africa, around the Cape, and across the Indian Ocean to Calicut.',
    goods:{
      cloth:{ name:'European cloth and brass', home:8, note:'Woolens, linen and brass basins from Europe.' },
      ivory:{ name:'Ivory', home:20, note:'Elephant tusks from East Africa, prized in India and China.' },
      gold:{ name:'Gold', home:30, note:'Gold from the Zimbabwe plateau, traded through Swahili ports like Sofala.' },
      pepper:{ name:'Pepper', home:60, note:'Black pepper from the Malabar Coast of India, the spice Europe wanted most.' },
      cinnamon:{ name:'Cinnamon', home:50, note:'From Sri Lanka, sold in the markets of Calicut.' }
    },
    stops:[
      { n:'Lisbon', mi:0, land:'city', shop:{ food:4, timber:10, buy:{ cloth:8 } } },
      { n:'Cape Verde Islands', mi:1600, land:'island', shop:{ food:6, timber:12, sell:{ cloth:12 },

        mnote:'The great pepper market of the Malabar Coast. Merchants here want gold and silver, not European cloth. Pepper bought here sells for about five times as much back in Lisbon, which is why Portugal kept coming back.' }, ev:{ need:'cannon', title:'Rivals in the harbor', what:'Merchants who already control the pepper trade want your fleet gone, and armed ships gather.',

        q:'What gave Portuguese fleets an edge over many Indian Ocean ships?',
        o:['Heavy cannons mounted on ships built to carry their weight','Much larger crews recruited from all over Western Europe','Better trade goods that Indian merchants wanted to buy','Alliances with the Ming navy, which sailed alongside them'] } }
    ] },
  { id:'columbus', flag:'es', name:'West Across the Atlantic', who:'Spain, 1492', captain:'Christopher Columbus', start:[1492, 7, 3], crew:90, minCrew:60, budget:140,
    hist:{ days:224, text:'The real Columbus left Palos on August 3, 1492 and sailed back into Palos on March 15, 1493: 224 days.' },
    brief:['Near Spain the winds blow the wrong way for going west','Weeks with no land, holding one heading','Winds that keep swinging around against you','Rulers who want maps of every coast','Shallow coasts full of reefs','A winter storm on the way home'],

      { n:'Hispaniola', mi:300, land:'island', shop:{ food:9, timber:8, buy:{ cotton:5, gold:18 }, sell:{ beads:16 },

var HOLD = 12, BEST_KEY = 'u4FleetBest', MI_STEADY = 85, MI_FAST = 110, SCURVY_DAYS = 40, FISH_CAP = 15;

var $ = function(id){ return document.getElementById(id); };
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function loadBest(){ try { return JSON.parse(localStorage.getItem(BEST_KEY) || '{}') || {}; } catch (e) { return {}; } }
function longestLeg(m){
  var best = 0, run = 0;
  m.stops.forEach(function(s, i){ if (!i) return; run += s.mi; if (s.shop || s.end) { best = Math.max(best, run); run = 0; } });

}
function fmtDate(d){ return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
function healthWord(h){ return h > 75 ? ['Good', 'ok'] : h > 50 ? ['Fair', 'mid'] : h > 25 ? ['Poor', 'lo'] : ['Very poor', 'lo']; }
function low(s){ return s.replace(/^A /, '').toLowerCase(); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

/* ── the outfitter ── */
function store(i){
  M = MISSIONS[i]; scene = 'store'; $('hud').classList.add('hidden'); renderStore.keep = false;
  cart = { tech:{}, asked:{}, food:0, timber:0, goods:{}, open:null, q:{} };
  Object.keys(TECH).forEach(function(k){
    cart.q[k] = shuffle(shuffle(Object.keys(ORIGINS).filter(function(o){ return o !== TECH[k].origin; })).slice(0, 3).concat(TECH[k].origin));
  });
  $('topSub').innerHTML = M.who + ' &middot; ' + M.captain;
  renderStore();
}
function spent(){
  var s = 0, sh = M.stops[0].shop;
  Object.keys(cart.tech).forEach(function(k){ s += TECH[k].cost; });
  Object.keys(cart.goods).forEach(function(k){ s += cart.goods[k] * sh.buy[k]; });
  return s + cart.food * sh.food + cart.timber * sh.timber;
}
/* the origin bonus counts only for technology still aboard, so buying and returning earns nothing */
function tagged(){ return Object.keys(cart.tech).filter(function(k){ return cart.asked[k]; }); }
function purse(){ return M.budget + BONUS * tagged().length - spent(); }
function renderStore(){

  Object.keys(TECH).forEach(function(k){

      (own ? '<button class="gb" type="button" data-sell="' + k + '">Return</button>' : '<button class="gb" type="button" data-buy="' + k + '"' + (t.cost > left ? ' disabled' : '') + '>Buy</button>') + '</div>';
    if (own && cart.open === k) {
      h += '<div class="bonus"><p class="say" style="font-size:22px;margin:4px 0">Bonus +' + BONUS + ' ducats: where did the ' + low(t.name) + ' come from?</p><div class="gopts">' +
        cart.q[k].map(function(o){ return '<button class="gopt" type="button" data-o="' + o + '" data-k="' + k + '">' + ORIGINS[o] + '</button>'; }).join('') + '</div></div>';
    } else if (k in cart.asked) {
      h += '<div class="bonus note ' + (cart.asked[k] ? 'good' : '') + '">' + (cart.asked[k] ? '<b>Right! +' + BONUS + ' ducats while it stays aboard.</b> ' : '<b>It came from ' + ORIGINS[t.origin] + '.</b> ') + t.note + '</div>';
    }
    h += '</div>';
  });
  h += '<h3>Supplies</h3>';
  [['food', 'Provisions (food and water)', (cart.food * 10) + ' days', 'per 10 days', 'Recommended: at least ' + need + ' days to reach the farthest port on this route.'],
   ['timber', 'Spare masts and timber', cart.timber + (cart.timber === 1 ? ' set' : ' sets'), 'per set', 'Storms can break a mast. Without a spare, repairs take days.']]
    .forEach(function(r){
      h += '<div class="row"><div class="nm">' + r[1] + '<small>' + r[4] + '</small></div><div class="pr">' + sh[r[0]] + ' d. ' + r[3] + '</div><div class="ctl">' +
        '<button class="step" type="button" data-p="' + r[0] + '" data-d="-1"' + (cart[r[0]] ? '' : ' disabled') + ' aria-label="Less">-</button><span class="qty">' + r[2] + '</span>' +
        '<button class="step" type="button" data-p="' + r[0] + '" data-d="1"' + (sh[r[0]] > left ? ' disabled' : '') + ' aria-label="More">+</button></div></div>';

  Object.keys(sh.buy).forEach(function(k){
    var g = M.goods[k], n = cart.goods[k] || 0;

      '<button class="step" type="button" data-g="' + k + '" data-d="-1"' + (n ? '' : ' disabled') + ' aria-label="Less">-</button><span class="qty">' + n + (n === 1 ? ' crate' : ' crates') + '</span>' +
      '<button class="step" type="button" data-g="' + k + '" data-d="1"' + (sh.buy[k] > left || loaded >= HOLD ? ' disabled' : '') + ' aria-label="More">+</button></div></div>';

$('panel').addEventListener('click', function(e){
  if (scene !== 'store') return;
  var b = e.target.closest('button'); if (!b || b.disabled) return;
  renderStore.keep = true;
  if (b.dataset.buy) { cart.tech[b.dataset.buy] = 1; if (!(b.dataset.buy in cart.asked)) cart.open = b.dataset.buy; renderStore(); }
  else if (b.dataset.sell) { delete cart.tech[b.dataset.sell]; if (cart.open === b.dataset.sell) cart.open = null; renderStore(); }
  else if (b.dataset.o) {
    var k = b.dataset.k, ok = b.dataset.o === TECH[k].origin;
    cart.asked[k] = ok; cart.open = null; renderStore();
  } else if (b.dataset.g) {
    var g = b.dataset.g; cart.goods[g] = Math.max(0, (cart.goods[g] || 0) + (+b.dataset.d)); if (purse() < 0) cart.goods[g]--; if (!cart.goods[g]) delete cart.goods[g]; renderStore();
  } else if (b.dataset.p) {
    var p = b.dataset.p; cart[p] = Math.max(0, cart[p] + (+b.dataset.d)); if (purse() < 0) cart[p]--; renderStore();
  }
});

/* ── the voyage ── */
function voyage(){
  scene = 'voyage';
  S = { date:new Date(M.start[0], M.start[1], M.start[2]), day:0, stop:0, left:M.stops[1].mi, traveled:0,
    total:M.stops.reduce(function(s, x){ return s + x.mi; }, 0),
    food:cart.food * 10, timber:cart.timber, hold:JSON.parse(JSON.stringify(cart.goods)), tBuy:0, tSell:0, ducats:purse(), crew:M.crew, health:100,
    pace:'steady', rations:'full', atSea:0, calm:0, weather:'fair', docked:true, mode:'menu',
    tech:cart.tech, score:0, evLog:[], log:[], dead:{}, seen:{}, bought:{}, good:'' };
  S.score += 10 * tagged().length;
  $('route').classList.remove('hidden');
  if (M.stops[0].ev) challenge(M.stops[0], function(){ menu('Your fleet is ready at <b>' + M.stops[0].n + '</b>.'); });
  else menu('Your fleet is ready at <b>' + M.stops[0].n + '</b>.');
}
function has(k){ return !!(S && S.tech[k]); }
function use(){ return (S.crew / M.crew) * (has('fluyt') ? 0.85 : 1) * { full:1, half:0.65, scant:0.4 }[S.rations]; }
function addLog(t){ S.log.unshift(fmtDate(S.date) + ': ' + t.replace(/<[^>]+>/g, '').replace(/&rsquo;/g, '\'')); if (S.log.length > 30) S.log.pop(); }
function lose(n, why){
  n = Math.min(n, S.crew); if (n <= 0) return '';
  S.crew -= n; S.dead[why] = (S.dead[why] || 0) + n;
  return n === 1 ? 'One sailor has died of ' + why + '.' : n + ' sailors have died of ' + why + '.';
}
function here(){ return M.stops[S.stop]; }
function next(){ return M.stops[S.stop + 1]; }

function renderStatus(){

/* The main menu, at sea or in port */
function menu(msg, keep){
  scene = 'voyage'; S.mode = 'menu'; stopTimer(); if (S.weather === 'night') S.weather = 'fair'; renderStatus();
  var st = here(), port = S.docked && st.shop, items = [{ act:'sail', t:S.docked ? 'Set sail for ' + next().n : 'Continue sailing' }];
  var stock = port && st.shop.limit ? st.shop.limit - (S.bought[S.stop] || 0) : 999;
  if (port && st.shop.food) items.push({ act:'buyfood', t:'Buy 10 days of provisions', sub:st.shop.food + ' ducats' + (st.shop.limit ? ', ' + Math.max(0, stock) + ' days for sale here' : ''), off:st.shop.food > S.ducats || stock < 10 });
  if (port && st.shop.timber) items.push({ act:'buytimber', t:'Buy a spare mast', sub:st.shop.timber + ' ducats', off:st.shop.timber > S.ducats });
  if (port && hasMarket(st)) items.splice(1, 0, { act:'market', t:'Enter the market', sub:'buy and sell goods' });
  items.push({ act:'supplies', t:'Check supplies' });
  items.push({ act:'pace', t:'Change pace', sub:'now ' + cap(S.pace) });
  items.push({ act:'rations', t:'Change rations', sub:'now ' + cap(S.rations) });
  items.push({ act:'rest', t:'Stop to rest', sub:'heals the crew' });
  if (!S.docked) items.push({ act:'fish', t:'Go fishing', sub:'1 day' });
  var fact = '';
  if (port && st.fact && !S.seen[S.stop]) { S.seen[S.stop] = 1; fact = '<div class="note">' + st.fact + '</div>'; }

  if (a.indexOf('r-') === 0) { S.rations = a.slice(2); return menu('Rations set to <b>' + S.rations + '</b>.'); }
  if (a === 'rest') return sub('How many days will you rest?' + (S.docked ? ' Rest in port heals faster.' : ' Rest heals faster in port.'),
    [1, 2, 3, 5].map(function(n){ return { act:'rest-' + n, t:n + (n === 1 ? ' day' : ' days') }; }));
  if (a.indexOf('rest-') === 0) return rest(+a.slice(5));
  if (a === 'fish') return fish();
});
function supplies(){
  var techs = Object.keys(S.tech).map(function(k){ return '<p class="say" style="font-size:22px;margin:0 0 4px">&middot; ' + TECH[k].name + ' <span style="color:var(--g-dim)">' + TECH[k].does + '</span></p>'; }).join('') || '<p class="say dim">No technology aboard.</p>';
  panel('<h2>Your supplies</h2>' +
    '<p class="say" style="font-size:23px">Provisions: <b>' + Math.floor(S.food) + '</b> days at full rations for the whole crew<br>' +
    'Spare masts: <b>' + S.timber + '</b><br>Cargo: <b>' + (cargo() ? Object.keys(S.hold).filter(function(k){ return S.hold[k]; }).map(function(k){ return S.hold[k] + ' ' + M.goods[k].name.toLowerCase(); }).join(', ') : 'empty') + '</b> (' + cargo() + ' of ' + HOLD + ' crates)<br>Ducats: <b>' + S.ducats + '</b><br>' +
    'Days at sea since the last port: <b>' + S.atSea + '</b>' + (S.atSea > SCURVY_DAYS ? ' <span style="color:var(--g-red)">(scurvy is spreading: reach a port)</span>' : '') + '</p>' +
    '<h3>Technology aboard</h3>' + techs + menuHtml([{ act:'back', t:'Back' }]));
}

/* Days pass. sailing = the ships are moving. Returns any news. */
var timer = null;
function stopTimer(){ if (timer) { clearInterval(timer); timer = null; } }
function pass(sailing, resting){
  S.day++; S.date = new Date(S.date.getTime() + 864e5);
  if (!S.docked) S.atSea++;
  S.food = Math.max(0, S.food - use());
  var dh = S.food <= 0 ? -8 : { full:0, half:-0.4, scant:-1 }[S.rations];
  if (resting) dh += S.docked ? 8 : 4;
  if (sailing && S.pace === 'fast') dh -= 0.7;
  if (S.atSea > SCURVY_DAYS) dh -= 1 + (S.atSea - SCURVY_DAYS) * 0.06;
  S.health = Math.max(0, Math.min(100, S.health + dh));
  var news = [];
  if (S.health < 60 && Math.random() < Math.min(1, (60 - S.health) / 80)) {
    var why = S.food <= 0 ? 'hunger and thirst' : S.atSea > SCURVY_DAYS ? 'scurvy' : 'fever';
    var died = lose(rnd(1, Math.max(1, Math.round(M.crew * (60 - S.health) / 1500))), why);
    if (sailing) { addLog(died); S.died = died; } else news.push(died);
  }
  if (sailing) {
    var mi = (S.pace === 'fast' ? MI_FAST : MI_STEADY) * (has('winds') ? 1.1 : 1) * (has('caravel') ? 1.05 : 1);
    if (S.calm > 0) { S.calm--; mi = 0; }
    else S.weather = Math.random() < 0.1 ? 'rain' : 'fair';
    S.left -= mi; S.traveled = Math.min(S.total, S.traveled + mi);
    if (!news.length && Math.random() < 0.08) {
      var ev = seaEvent();
      if (ev.charAt(0) === '+') { S.good = ev.slice(1); addLog(S.good); } else news.push(ev);
    }
  }
  return news.filter(Boolean);
}
function sail(){
  if (S.docked) { S.docked = false; S.left = next().mi; addLog('Set sail for ' + next().n + '.'); }
  S.mode = 'sail'; S.weather = 'fair';
  S.good = '';
  panel('<p class="say">Sailing for <b>' + next().n + '</b>...</p><p class="say" id="sailNews" style="color:var(--g-green);font-size:23px"></p><p class="say" id="sailWarn" style="color:var(--g-red);font-size:23px"></p>' + menuHtml([{ act:'back', t:'Stop the ships', sub:'to rest, fish, or change pace or rations' }]) + logHtml());
  renderStatus();
  stopTimer();
  timer = setInterval(function(){
    var news = pass(true);
    renderStatus();
    if (dead()) return;
    if (S.good && $('sailNews')) $('sailNews').textContent = S.good;
    if (S.health > 60) S.warned = false;
    if (S.health < 40 && !S.warned) { S.warned = true; return notice('<b>Your crew is weak and sailors are dying.</b> Stop to rest, give full rations, go fishing if food is short, or push hard for the next port.'); }
    var fd = S.food / Math.max(0.01, use());
    if ($('sailWarn')) $('sailWarn').textContent = (S.died ? S.died + ' ' : '') + (fd < 15 ? (fd <= 0 ? 'Out of provisions! The crew is starving. Press 1 to stop and go fishing.' : 'Provisions are running low. Press 1 to stop the ships and go fishing.') : '');
    S.died = '';
    if (news.length) { news.forEach(addLog); return notice(news.join(' ')); }
    if (S.left <= 0) arrive();
  }, 260);
}
function notice(msg, then){
  S.mode = 'notice'; stopTimer(); renderStatus();
  panel('<p class="say">' + msg + '</p>' + menuHtml([{ act:'ok', t:'Continue' }]) + logHtml());
  notice.then = then || null;
}
function dead(){
  if (S.crew >= M.minCrew) return false;
  stopTimer(); S.mode = 'over';
  notice('<b>Only ' + S.crew + ' sailors are left, too few to work the ships. The voyage is abandoned.</b>', function(){ finish(false); });
  return true;
}

/* Random days at sea; technology changes the odds */
function brokeMast(chance){
  if (Math.random() > chance) return '';
  if (S.timber) { S.timber--; return ' A mast cracked, but you had a spare and fixed it.'; }
  S.calm += 4; return ' A mast cracked, and with no spare the crew spends 4 days rigging a new one.';
}
function seaEvent(){
  var nx = next(), nearCoast = nx.land && S.left < 200;
  var table = [
    [14, function(){ S.weather = 'storm'; S.calm = rnd(1, 2); return 'A storm! The fleet is driven back and loses ' + S.calm + (S.calm === 1 ? ' day.' : ' days.') + brokeMast(has('rudder') ? 0.15 : 0.45); }],
    [has('lateen') ? 5 : 12, function(){ S.calm = rnd(2, 4); S.weather = 'calm'; return 'Becalmed. Not a breath of wind: ' + S.calm + ' days without moving.' + (has('lateen') ? '' : ' (A lateen sail would catch the lightest wind.)'); }],
    [has('compass') ? 0 : 9, function(){ S.left += 170; S.weather = 'fog'; return 'Thick fog. With no compass you drift off course and lose about two days.'; }],
    [has('astrolabe') || S.atSea < 15 ? 0 : 8, function(){ S.left += 110; return 'Unsure of your latitude, the fleet doubles back to check. You lose a day.'; }],
    [5, function(){ S.food += 6; return '+A huge school of fish swarms the ships. The crew catches 6 days of food.'; }],
    [6, function(){ S.weather = 'rain'; S.food += 3; return '+Heavy rain. You refill the water casks.'; }],
    [6, function(){ var l = Math.round(S.food * 0.15); S.food -= l; return 'Rats got into the biscuit. You lose ' + l + ' days of food.'; }],
    [6, function(){ S.health = Math.max(0, S.health - 8); return 'Fever spreads below decks. ' + lose(rnd(1, 3), 'fever'); }],
    [4, function(){ lose(1, 'drowning'); return 'A sailor is swept overboard in the night and is lost.'; }],
    [S.stop > 0 ? 5 : 0, function(){
      if (has('cannon')) return 'Pirates close in, but a few shots from your cannons drive them off.';
      var take = Math.min(S.ducats, rnd(10, 20)); S.ducats -= take; S.food = Math.max(0, S.food - 8);
      return 'Pirates board one of your ships! With no cannons to stop them they take ' + take + ' ducats and 8 days of food. ' + lose(rnd(2, 4), 'wounds'); }],
    [7, function(){ S.left -= 140; return '+A strong, steady wind fills the sails. You make an extra 140 miles.'; }],
    [nearCoast && !has('charts') ? 12 : 0, function(){ S.calm = 2; return 'You strike a reef in unknown waters and spend 2 days patching the hull. (Portolan charts would have shown the hazards.)' + brokeMast(0.3); }]
  ];
  var tot = table.reduce(function(s, t){ return s + t[0]; }, 0), r = Math.random() * tot;
  for (var i = 0; i < table.length; i++) { r -= table[i][0]; if (r < 0) return table[i][1](); }
  return '';
}

/* Resting: the scene turns to night and the days tick by */
function rest(n){
  S.mode = 'rest'; stopTimer(); S.weather = 'night';
  var before = healthWord(S.health)[0], i = 0, news = [];
  panel('<p class="say">The crew rests' + (S.docked ? ' in port' : ' at anchor') + '. Sails are furled and the watch is light.</p><p class="say" id="restDay"><b>Day 0 of ' + n + '</b></p>');
  renderStatus();
  timer = setInterval(function(){
    i++; news = news.concat(pass(false, true)); renderStatus();
    var d = $('restDay'); if (d) d.innerHTML = '<b>Day ' + i + ' of ' + n + '</b> &middot; ' + fmtDate(S.date) + ' &middot; health ' + healthWord(S.health)[0];
    if (i < n) return;
    stopTimer(); S.weather = 'fair'; addLog('Rested ' + n + (n === 1 ? ' day.' : ' days.'));
    if (dead()) return;
    menu('You rested <b>' + n + (n === 1 ? ' day' : ' days') + '</b>. Crew health: ' + before + ' &rarr; <b>' + healthWord(S.health)[0] + '</b>.' + (news.length ? ' ' + news.join(' ') : ''));
  }, 700);
}

/* Fishing: click the fish that leap from the water */
var fishing = null;
function fish(){
  S.mode = 'fish'; stopTimer();
  fishing = { start:performance.now(), len:15000, fish:[], caught:0, nextAt:0, pops:[] };
  $('scene').classList.add('fishing');
  panel('<p class="say">Lines over the side! <b>Click the fish</b> as they leap from the water. You have 15 seconds.</p><p class="say dim">Each fish feeds the crew for 1 day. You can salt and store at most ' + FISH_CAP + ' days of fish from one trip.</p>' +
    menuHtml([{ act:'fishstop', t:'Stop fishing' }]));
  $('panel').querySelector('[data-act="fishstop"]').onclick = endFish;
}
function endFish(){
  if (!fishing) return;
  var days = Math.min(FISH_CAP, fishing.caught);
  fishing = null; $('scene').classList.remove('fishing');
  var news = pass(false);
  S.food += days; addLog('Fishing: ' + days + ' days of food.');
  if (dead()) return;
  menu('You spent a day fishing and brought in <b>' + days + ' days of food</b>.' + (news.length ? ' ' + news.join(' ') : ''));
}
$('scene').addEventListener('pointerdown', function(e){
  if (!fishing) return;
  var r = this.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  fishing.fish.forEach(function(f){
    if (f.caught || f.gone) return;
    if (Math.abs(f.x - x) < 34 && Math.abs(f.y - y) < 28) { f.caught = true; fishing.caught++; fishing.pops.push({ x:f.x, y:f.y, t:performance.now() }); }
  });
});

/* ── the market: buy low, sell high, and learn what each place wanted ── */
function cargo(){ var n = 0; for (var k in S.hold) n += S.hold[k]; return n; }
function hasMarket(st){ return !!(st.shop && (st.shop.buy || st.shop.sell)); }
function market(msg, final){
  scene = 'voyage'; S.mode = 'market'; stopTimer(); renderStatus();
  market.final = !!final;
  var st = here(), sh = st.shop, h = (msg ? '<p class="say">' + msg + '</p>' : '') + '<h2>The market at ' + st.n + '</h2>' + (sh.mnote ? '<div class="note">' + sh.mnote + '</div>' : '') +
    '<p class="say">Purse: <b>' + S.ducats + ' ducats</b> &middot; Hold: <b>' + cargo() + ' of ' + HOLD + '</b> crates</p>';
  Object.keys(M.goods).forEach(function(k){
    var g = M.goods[k], n = S.hold[k] || 0, bp = sh.buy && sh.buy[k], sp = sh.sell && sh.sell[k];
    if (!bp && !sp && !n) return;
    h += '<div class="row"><div class="nm">' + g.name + ' <span style="color:var(--g-dim)">(you have ' + n + ')</span><small>' + g.note + ' Worth about ' + g.home + ' ducats back home.</small></div>' +
      '<div class="pr">' + (bp ? 'Buy ' + bp : '') + (bp && sp ? ' &middot; ' : '') + (sp ? 'Sell ' + sp : (bp ? '' : 'No buyers')) + '</div><div class="ctl">' +
      (bp ? '<button class="gb" type="button" data-mb="' + k + '"' + (bp > S.ducats || cargo() >= HOLD ? ' disabled' : '') + '>Buy</button>' : '') +
      (sp ? '<button class="gb" type="button" data-ms="' + k + '"' + (n ? '' : ' disabled') + '>Sell</button>' : '') + '</div></div>';
  });
  h += '<p class="say dim" style="margin-top:10px">Trade so far: bought ' + S.tBuy + ' ducats of goods, sold ' + S.tSell + '.</p>' +
    menuHtml([final ? { act:'finish', t:'Finish the voyage' } : { act:'leavemarket', t:'Leave the market' }]);
  panel(h, false, market.keep); market.keep = false;
}
function trade(k, buying){
  var sh = here().shop, g = M.goods[k];
  if (buying) {
    if (sh.buy[k] > S.ducats || cargo() >= HOLD) return;
    S.ducats -= sh.buy[k]; S.tBuy += sh.buy[k]; S.hold[k] = (S.hold[k] || 0) + 1; addLog('Bought a crate of ' + g.name.toLowerCase() + ' for ' + sh.buy[k] + '.');
  } else {
    if (!S.hold[k]) return;
    S.hold[k]--; S.ducats += sh.sell[k]; S.tSell += sh.sell[k]; addLog('Sold a crate of ' + g.name.toLowerCase() + ' for ' + sh.sell[k] + '.');
  }
  market.keep = true; market(null, market.final);
}

/* ── stops and challenges ── */
function arrive(){
  stopTimer();
  S.stop++; S.left = 0;
  S.traveled = M.stops.slice(0, S.stop + 1).reduce(function(s, x){ return s + x.mi; }, 0);
  var st = here();
  if (st.shop || st.end) { S.docked = true; S.atSea = 0; S.health = Math.min(100, S.health + 5); }
  addLog('Reached ' + st.n + '.');
  renderStatus();
  var after = function(){
    if (st.end) return hasMarket(st) ? market('You have reached <b>' + st.n + '</b>! Before the voyage ends, trade one last time: whatever is in your hold counts toward your fortune.', true) : finish(true);
    if (hasMarket(st)) return market('You have reached <b>' + st.n + '</b>. Merchants crowd the docks.');
    if (st.shop) return menu('You have reached <b>' + st.n + '</b>.');
    S.left = next().mi; sail();
  };
  if (st.ev) challenge(st, after);
  else after();
}
function challenge(st, then){
  var ev = st.ev; S.mode = 'event'; stopTimer(); renderStatus();
  var h = '<p class="say dim">' + st.n + '</p><p class="say"><b>' + ev.title + '.</b> ' + ev.what + '</p>';
  if (has(ev.need)) h += '<div class="menu"><button class="mi" type="button" id="useBtn"><span class="k">1.</span>Use your ' + low(TECH[ev.need].name) + '</button></div>';
  else h += '<p class="say dim">Nothing aboard solves this. Improvise: answer correctly to get through with smaller losses.</p>' +
      '<p class="say" style="font-size:24px">' + ev.q + '</p><div class="gopts" id="impOpts">' +
      shuffle(ev.o.map(function(o, i){ return { t:o, ok:i === 0 }; })).map(function(o){ return '<button class="gopt" type="button" data-ok="' + (o.ok ? 1 : 0) + '">' + o.t + '</button>'; }).join('') + '</div>';
  panel(h + '<div id="evOut"></div>');
  function done(html){
    $('evOut').innerHTML = html + '<div class="menu"><button class="mi" type="button" id="evCont"><span class="k">1.</span>Continue</button></div>';
    var u = $('useBtn'); if (u) u.classList.remove('mi');
    renderStatus();
    $('evCont').onclick = function(){ if (!dead()) then(); };
  }
  if ($('useBtn')) $('useBtn').onclick = function(){
    this.disabled = true; S.score += 20; S.evLog.push({ ev:ev, how:'tech' });
    addLog(ev.title + ': solved with the ' + low(TECH[ev.need].name) + '.');
    done('<div class="note good"><b>' + TECH[ev.need].name + ':</b> ' + ev.have + '</div>');
  };
  if ($('impOpts')) $('impOpts').onclick = function(e){
    var b = e.target.closest('.gopt'); if (!b || b.disabled) return;
    var ok = b.dataset.ok === '1';
    Array.prototype.forEach.call(this.querySelectorAll('.gopt'), function(x){ x.disabled = true; if (x.dataset.ok === '1') x.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    var days = ok ? 3 : 7, news = [lose(Math.round(M.crew * (ok ? 0.04 : 0.12)), 'injuries')];
    for (var i = 0; i < days; i++) news = news.concat(pass(false));
    if (ok) S.score += 10;
    S.evLog.push({ ev:ev, how:ok ? 'right' : 'wrong' });
    addLog(ev.title + (ok ? ': improvised.' : ': disaster.'));
    done('<div class="note ' + (ok ? 'good' : 'bad') + '">' + (ok ? 'You improvise and get through.' : 'A costly mistake.') + ' ' + days + ' days lost. ' + news.filter(Boolean).join(' ') +
      ' <b>The tool for this was the ' + low(TECH[ev.need].name) + '.</b> ' + ev.have + '</div>');
  };
}

/* ── the end ── */
function finish(arrived){
  stopTimer(); scene = 'end'; S.mode = 'over';
  var surv = Math.round(100 * S.crew / M.crew), st = M.stops[M.stops.length - 1];
  var cargoVal = 0; Object.keys(S.hold).forEach(function(k){ cargoVal += S.hold[k] * M.goods[k].home; });
  var fortune = S.ducats + cargoVal, fortunePts = Math.floor(fortune / 2);
  var par = Math.round(S.total / MI_STEADY) + 30, quick = arrived ? Math.max(0, par - S.day) * 3 : 0;
  if (arrived) S.score += 50 + surv + quick + fortunePts;
  var best = loadBest(), isBest = best[M.id] == null || S.score > best[M.id];
  if (isBest) { best[M.id] = S.score; try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch (e) {} }
  var deaths = Object.keys(S.dead).map(function(k){ return S.dead[k] + ' to ' + k; }).join(', ');
  var rows = S.evLog.map(function(r){
    return '<tr><td>' + r.ev.title + ' <span style="color:var(--g-dim)">(needed: ' + TECH[r.ev.need].name + ')</span></td><td>' + (r.how === 'tech' ? 'Solved +20' : r.how === 'right' ? 'Improvised +10' : 'Disaster +0') + '</td></tr>';
  });
  var nTag = tagged().length;
  rows.push('<tr><td>Origins named correctly</td><td>' + nTag + ' &times; 10</td></tr>');
  if (arrived) rows.push('<tr><td>Arrival</td><td>+50</td></tr><tr><td>Crew alive: ' + surv + '% (+1 per percent)</td><td>+' + surv + '</td></tr><tr><td>Speed: ' + S.day + ' days (par ' + par + ', +3 for each day under)</td><td>+' + quick + '</td></tr><tr><td>Fortune: ' + S.ducats + ' ducats + cargo worth ' + cargoVal + (M.stops[0].n === st.n ? ' here at home' : ' back home') + ' = ' + fortune + ' (+1 per 2 ducats)</td><td>+' + fortunePts + '</td></tr>');
  rows.push('<tr><td>Trade ledger: bought ' + S.tBuy + ', sold ' + S.tSell + '</td><td>' + (S.tSell - S.tBuy >= 0 ? '+' : '') + (S.tSell - S.tBuy) + ' d.</td></tr>');
  var by = {};
  Object.keys(TECH).forEach(function(k){ (by[TECH[k].origin] = by[TECH[k].origin] || []).push(TECH[k].name); });
  panel('<h2>' + (arrived ? (surv >= 75 ? 'A legendary voyage!' : surv >= 50 ? 'You made it.' : 'You limped into port.') : 'The voyage failed.') + '</h2>' +
    '<p class="say">' + (arrived ? 'You reached ' + st.n + ' on ' + fmtDate(S.date) + ' after ' + S.day + ' days' : 'The voyage ended on ' + fmtDate(S.date) + ' after ' + S.day + ' days') +
    ', with ' + S.crew + ' of ' + M.crew + ' sailors alive.' + (deaths ? ' Lost: ' + deaths + '.' : '') + '</p>' +
    '<p class="say dim">' + M.hist.text + '</p>' +
    '<p class="say">Score: <b>' + S.score + '</b>' + (isBest ? ' (new best on this browser!)' : ' (your best: ' + best[M.id] + ')') + '</p>' +
    '<table class="sum">' + rows.join('') + '</table>' +
    '<h3>Where the technology came from</h3><div class="origins">' + Object.keys(ORIGINS).map(function(o){ return '<div><b>' + ORIGINS[o] + '</b>' + by[o].join(', ') + '</div>'; }).join('') + '</div>' +
    '<div class="note"><b>The big idea (4.1):</b> Europe&rsquo;s ocean voyages were built on technology borrowed from across Afro-Eurasia: the compass, sternpost rudder and gunpowder from China, the astrolabe from Greek and Islamic scholars, the lateen sail and monsoon knowledge from Arab and Indian Ocean sailors. Europeans combined and adapted them, then added new ship designs and knowledge of Atlantic winds.</div>' +
    '<div class="menu"><button class="mi" type="button" id="againBtn"><span class="k">1.</span>Sail this voyage again</button><button class="mi" type="button" id="otherBtn"><span class="k">2.</span>Choose another voyage</button></div>', true);
  $('againBtn').onclick = function(){ store(MISSIONS.indexOf(M)); };
  $('otherBtn').onclick = title;
  if (window.APWH_ACTIVITY) APWH_ACTIVITY.done('game', 'fleet');
}

/* ── full screen ── */
$('fsBtn').onclick = function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else if ($('shell').requestFullscreen) $('shell').requestFullscreen().catch(function(){});
};
document.addEventListener('fullscreenchange', function(){ $('fsBtn').innerHTML = document.fullscreenElement ? '&#10005; Exit full screen' : '&#9974; Full screen'; setTimeout(fit, 50); });

/* ── the pixel scene ── */
var cv = $('scene'), cx = cv.getContext('2d'), P = 4, W = 800, H = 250, SEA = 150;
var wave = 0, cloud = 0, rain = [], stars = [];
for (var ri = 0; ri < 70; ri++) rain.push([Math.random() * 900, Math.random() * 400]);
for (var si = 0; si < 60; si++) stars.push([Math.random(), Math.random() * 0.55, Math.random()]);
function fit(){
  var r = cv.getBoundingClientRect(); if (!r.width) return;
  H = 260; W = Math.max(400, Math.round(H * r.width / r.height / P) * P);
  cv.width = W; cv.height = H; SEA = 168;
}
window.addEventListener('resize', fit);
function px(x, y, w, h, c){ cx.fillStyle = c; cx.fillRect(Math.round(x / P) * P, Math.round(y / P) * P, w * P, h * P); }
function drawSky(kind){
  var bands = kind === 'night' ? ['#0a1028', '#0e1634', '#131d40', '#18244c'] : kind === 'storm' ? ['#2b3445', '#323d51', '#3a465c', '#43506a'] : ['#5e98d6', '#6ea6de', '#80b4e5', '#95c3eb'];
  var bh = Math.ceil(SEA / 4 / P);
  for (var i = 0; i < 4; i++) px(0, i * bh * P, W / P + 1, bh, bands[i]);
  if (kind === 'night') {
    stars.forEach(function(s){ if (Math.sin(Date.now() / 600 + s[2] * 9) > -0.6) px(s[0] * W, s[1] * SEA, 1, 1, '#e8ecff'); });
    px(W * 0.78, SEA * 0.18, 6, 6, '#f4f1dc'); px(W * 0.78 + 12, SEA * 0.18, 3, 6, '#0e1634');
    return;
  }
  if (kind !== 'storm') { px(W * 0.8, SEA * 0.2, 6, 6, '#ffe28a'); px(W * 0.8 - 4, SEA * 0.2 + 4, 8, 4, '#ffe28a'); }
  var cc = kind === 'storm' ? '#5a6478' : '#f4f8ff';
  [[0.08, 0.2], [0.38, 0.36], [0.65, 0.14], [0.95, 0.42]].forEach(function(c, i){
    var x = ((c[0] * W - cloud * (0.6 + i * 0.15)) % (W + 160) + W + 160) % (W + 160) - 80, y = c[1] * SEA;
    px(x, y, 14, 3, cc); px(x + 8, y - 8, 8, 3, cc); px(x + 16, y + 8, 12, 2, cc);
  });
}
function drawSea(kind, still){
  var bands = kind === 'night' ? ['#16325a', '#132c50', '#102645', '#0d203a', '#0a1a30'] : ['#2d6fb0', '#2865a3', '#235a95', '#1c4c7e', '#163f6b'];
  var bh = Math.ceil((H - SEA) / 5 / P);
  for (var i = 0; i < 5; i++) px(0, SEA + i * bh * P, W / P + 1, bh, bands[i]);
  var crest = kind === 'storm' ? '#c9d8ea' : kind === 'night' ? '#3d6a9e' : '#8fc0ec';
  for (var row = 0; row < 5; row++) {
    var off = still ? 0 : wave * (1 + row * 0.35);
    for (var k = 0; k < Math.ceil(W / 90); k++) {
      var x = ((k * 97 + row * 41 - off) % (W + 40) + W + 40) % (W + 40) - 20;
      px(x, SEA + row * bh * P + 6, row < 2 ? 3 : 5, 1, crest);
    }
  }
}
function drawLand(kind, x, night){
  var d = night ? 0.45 : 1;
  function c(hex){ if (d === 1) return hex; var n = parseInt(hex.slice(1), 16); return 'rgb(' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function(v){ return Math.round(v * d); }).join(',') + ')'; }
  if (kind === 'island') { px(x, SEA - 24, 30, 6, c('#3f7d3a')); px(x + 24, SEA - 40, 18, 4, c('#4c8f45')); px(x + 40, SEA - 52, 8, 3, c('#5aa04f')); px(x - 8, SEA - 4, 48, 1, c('#e8d79a')); }
  else if (kind === 'coast') { px(x, SEA - 36, 120, 9, c('#6f6a4a')); px(x + 20, SEA - 56, 80, 5, c('#7d7756')); px(x + 60, SEA - 72, 30, 4, c('#8a845f')); px(x, SEA - 4, 120, 1, c('#e8d79a')); }
  else if (kind === 'city') {
    px(x, SEA - 16, 120, 4, c('#7a6a52')); px(x - 8, SEA - 4, 128, 1, c('#e8d79a'));
    [[8, 10], [28, 16], [48, 8], [64, 22], [88, 12], [108, 18]].forEach(function(b, i){
      px(x + b[0], SEA - 16 - b[1] * 2, 4, b[1] / 2, c(i % 2 ? '#d9c7a6' : '#c2ad88'));
      px(x + b[0] + 4, SEA - 16 - b[1] * 2 + 8, 1, 1, night ? '#ffd27a' : '#4a3b28');
    });
  }
}
function drawShip(x, y, flag, furled, night){
  var rail = '#9a6331', hull = '#6b3e1f', hullD = '#4e2b14', sail = '#f3ead2', sailD = '#d9cfb4';
  for (var r = 0; r < 5; r++) px(x - (56 - r * 6), y + r * 4, 28 - r * 3, 1, r === 0 ? rail : r === 4 ? hullD : hull);
  px(x + 44, y - 8, 4, 2, hull); px(x - 60, y - 6, 4, 2, hull);
  [[-28, 26], [4, 32], [32, 22]].forEach(function(m, i){
    var top = y - m[1] * 4;
    px(x + m[0], top, 1, m[1], '#3a2614');
    if (furled) { px(x + m[0] - 12, top + 14, 7, 1, sailD); px(x + m[0] - 8, top + 50, 5, 1, sailD); return; }
    if (i === 2 && has('lateen')) { for (var t = 0; t < 8; t++) px(x + m[0] - t * 3 + 4, top + 12 + t * 8, t + 1, 2, sail); return; }
    px(x + m[0] - 12, top + 12, 7, 6, sail); px(x + m[0] - 12, top + 36, 7, 1, sailD);
    px(x + m[0] - 8, top + 48, 5, 5, sail);
    if (flag !== 'nl' && i < 2) { px(x + m[0] - 2, top + 16, 1, 4, '#c0392b'); px(x + m[0] - 8, top + 24, 4, 1, '#c0392b'); }
  });
  if (night) { px(x + 46, y - 20, 2, 2, '#ffd27a'); px(x - 20, y + 4, 1, 1, '#ffd27a'); px(x + 4, y + 4, 1, 1, '#ffd27a'); }
  var fy = y - 136, fc = flag === 'nl' ? ['#e8822a', '#f4f4f4', '#2a4e9c'] : flag === 'es' ? ['#c0392b', '#f2c230', '#c0392b'] : ['#1f7a3c', '#c0392b', '#c0392b'];
  for (var f = 0; f < 3; f++) px(x + 8, fy + f * 4, 5, 1, fc[f]);
}
function drawSmall(x, y, furled){
  for (var r = 0; r < 3; r++) px(x - (28 - r * 4), y + r * 4, 14 - r * 2, 1, r ? '#5a3418' : '#8a5a2c');
  px(x - 4, y - 48, 1, 12, '#3a2614');
  if (!furled) { px(x - 12, y - 40, 5, 3, '#efe5cb'); px(x - 10, y - 24, 4, 2, '#efe5cb'); }
}
function banner(text){
  cx.font = '34px VT323, monospace'; cx.textAlign = 'center';
  var w = cx.measureText(text).width + 30;
  cx.fillStyle = 'rgba(11,20,48,.8)'; cx.fillRect(W / 2 - w / 2, 12, w, 42);
  cx.fillStyle = '#f5b942'; cx.fillText(text, W / 2, 43);
}
function drawFish(now){
  if (!fishing) return;
  var t = now - fishing.start;
  if (t > fishing.len) { endFish(); return; }
  if (t > fishing.nextAt) { fishing.fish.push({ x:W * 0.45 + Math.random() * W * 0.45, t0:now, dur:1200 + Math.random() * 600, dir:Math.random() < 0.5 ? -1 : 1, h:50 + Math.random() * 60 }); fishing.nextAt = t + 450 + Math.random() * 450; }
  fishing.fish.forEach(function(f){
    var p = (now - f.t0) / f.dur; if (p > 1) { f.gone = true; return; }
    if (f.caught) return;
    f.x += f.dir * 0.8; f.y = SEA - Math.sin(Math.PI * p) * f.h;
    px(f.x - 10, f.y - 4, 5, 2, '#c8d6e5'); px(f.x - (f.dir > 0 ? 18 : -10), f.y - 6, 2, 3, '#9fb2c8'); px(f.x + f.dir * 6 - 2, f.y - 4, 1, 1, '#1b2a3d');
  });
  fishing.pops = fishing.pops.filter(function(pp){ return now - pp.t < 700; });
  cx.font = '28px VT323, monospace'; cx.textAlign = 'center'; cx.fillStyle = '#f5b942';
  fishing.pops.forEach(function(pp){ cx.fillText('+1 day', pp.x, pp.y - 20 - (now - pp.t) / 30); });
  banner('Fish caught: ' + fishing.caught + '    Time left: ' + Math.max(0, Math.ceil((fishing.len - t) / 1000)));
}
function render(now){
  var mode = S ? S.mode : 'title', wx = S ? S.weather : 'fair';
  var atSea = mode === 'sail' || mode === 'notice';
  var sky = mode === 'rest' ? 'night' : wx === 'storm' && atSea ? 'storm' : 'day';
  var moving = mode === 'sail' && wx !== 'calm';
  if (moving) wave += wx === 'storm' ? 3 : 1.6; else wave += 0.25;
  cloud += moving ? 0.5 : 0.12;
  cx.clearRect(0, 0, W, H);
  drawSky(sky);
  drawSea(sky, wx === 'calm' && atSea);
  var furled = !!(S && (S.docked || mode === 'rest' || mode === 'fish'));
  if (S && M) {
    var nx = next(), hs = here();
    if (S.docked && hs.land) drawLand(hs.land, W - 330, sky === 'night');
    else if (nx && nx.land && atSea && S.left < 600) drawLand(nx.land, W - (1 - S.left / 600) * 330);
  }
  var storm = sky === 'storm';
  var bob = Math.round(Math.sin(Date.now() / (storm ? 180 : 420)) * (storm ? 6 : 3));
  drawSmall(Math.round(W * 0.15), SEA + 6 + Math.round(Math.sin(Date.now() / 500 + 1) * 2), furled);
  drawShip(Math.round(W * 0.34), SEA - 4 + bob, M ? M.flag : 'pt', furled, sky === 'night');
  if (mode === 'rest') banner('Resting  ' + fmtDate(S.date));
  else if (S && S.docked && mode !== 'fish' && scene === 'voyage') banner('In port: ' + here().n.replace(/&rsquo;/g, '\''));
  if ((wx === 'storm' || wx === 'rain') && atSea) {
    cx.fillStyle = 'rgba(220,230,255,.55)';
    rain.forEach(function(r){ r[1] += 9; r[0] -= 3; if (r[1] > H) { r[1] = -10; r[0] = Math.random() * (W + 60); } cx.fillRect(r[0], r[1], 2, 10); });
  }
  if (wx === 'fog' && atSea) { cx.fillStyle = 'rgba(230,235,240,.55)'; cx.fillRect(0, 0, W, H); }
  drawFish(now || performance.now());
  requestAnimationFrame(render);
}
fit();
requestAnimationFrame(render);
title();
</script>
