<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">

<title>Unit 5 The Urban Game</title>
<meta name="description" content="Plan an English market town through the Industrial Revolution, 1750 to 1900: clear forests, dig canals, build mills, tenements and railways, and watch the smoke, the crowding and the reforms that followed.">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --g-bg:#eef3fa;--g-card:#ffffff;--g-line:#cfdcec;--g-text:#16244d;--g-dim:#66748f;
  --g-amber:#b8860b;--g-gold:#f4cd4f;--g-blue:#345fbf;--g-green:#1a8a4a;--g-red:#cc3d3d;
  --g-shadow:0 1px 4px rgba(22,36,77,.10),0 8px 26px rgba(22,36,77,.10)
}
*{box-sizing:border-box}
body{margin:0;background:var(--g-bg);color:var(--g-text);font:16px/1.5 'Lato',-apple-system,'Segoe UI',sans-serif}
.hidden{display:none!important}
#shell{position:fixed;inset:0;z-index:1000;background:var(--g-bg);color:var(--g-text);display:flex;flex-direction:column}
#shell .bar{display:flex;align-items:center;gap:14px;padding:8px 18px;background:#16244d;color:#fff;box-shadow:0 2px 0 var(--g-blue);flex-shrink:0;z-index:2}
#shell .bar .brand{text-decoration:none;color:#fff;flex-shrink:0}
#shell .tivin-emblem{--em:46px!important}
#shell .tivin-wordmark b{font-size:1.05rem}
#shell .tivin-wordmark i{font-size:.52rem;margin-top:3px}
.top .ttl{font:900 1.15rem 'Lato',sans-serif;color:#fff;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid rgba(255,255,255,.25);padding-left:14px}
.top .ttl small{display:block;font:700 .62rem 'Lato',sans-serif;color:var(--g-gold);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.hud{display:flex;gap:8px;white-space:nowrap}
.hud span{background:rgba(255,255,255,.1);border:1px solid rgba(244,205,79,.55);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.92rem;color:#fff}
.hud b{color:var(--g-gold);font-weight:900}
.top a.nav,.top button{font:700 .7rem 'Lato',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:transparent;border:0;border-bottom:2px solid transparent;padding:6px 2px;text-decoration:none;cursor:pointer;white-space:nowrap}
.top a.nav:hover,.top button:hover{color:var(--g-gold);border-bottom-color:var(--g-gold)}

.main{flex:1;min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr) 220px}
.side{overflow-y:auto;background:#fbf8f1;border-right:1px solid var(--g-line);padding:12px 12px 18px}
.stats{overflow-y:auto;background:#fbf8f1;border-left:1px solid var(--g-line);padding:12px;display:flex;flex-direction:column;gap:8px}
.mapwrap{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:#dfe9d3}
.maptools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:#fff;border-bottom:1px solid var(--g-line);font-size:.8rem}
.maptools label{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--g-dim);cursor:pointer}
.maptools .hint{margin-left:auto;color:var(--g-dim)}
.rotbtn{font:inherit;font-weight:900;font-size:.8rem;padding:5px 12px;border-radius:999px;border:2px solid var(--g-navy,#16244d);background:var(--g-navy,#16244d);color:#fff;cursor:pointer}
.rotbtn:disabled{background:#fff;color:var(--g-dim);border-color:var(--g-line);cursor:default}
.rotbtn.on{background:#f4b428;border-color:#f4b428;color:#16244d}
.mapbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
#map{display:block;max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.25);touch-action:none;cursor:crosshair;image-rendering:auto;background:#7fb069}
#tip{position:absolute;pointer-events:none;background:rgba(22,36,77,.94);color:#fff;font-size:.78rem;line-height:1.4;padding:7px 10px;border-radius:8px;max-width:260px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tip b{color:var(--g-gold)}

.rc{background:var(--g-card);border-radius:14px;padding:12px 14px;box-shadow:var(--g-shadow);margin-bottom:10px}
.rc .yr{font:900 1.7rem 'Lato',sans-serif;letter-spacing:-.02em;line-height:1}
.rc .hl{font-weight:900;color:var(--g-blue);font-size:.95rem;margin-top:2px}
.rc h4{font-size:.62rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--g-dim);margin:10px 0 6px}
.ord{display:flex;align-items:center;gap:8px;font-size:.86rem;padding:3px 0}
.ord i{font-style:normal;flex-shrink:0;width:20px;height:20px;border-radius:50%;border:2px solid var(--g-line);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:#fff}
.ord.done i{background:var(--g-green);border-color:var(--g-green)}
.ord.done span{color:var(--g-dim);text-decoration:line-through}
.ord b{margin-left:auto;font-size:.8rem;color:var(--g-dim);white-space:nowrap}
.permits{display:flex;align-items:center;justify-content:space-between;background:#fff5dc;border-radius:10px;padding:6px 10px;font-size:.85rem;font-weight:700;color:#7a5a0a;margin-top:8px}
.permits b{font-size:1.1rem;color:var(--g-amber)}
.limits{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:6px;font-size:.76rem;color:var(--g-dim);font-weight:700}
.limits b{color:var(--g-text);font-size:.9rem}
.pal h4{font-size:.62rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--g-dim);margin:12px 0 6px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pb{display:flex;align-items:center;gap:6px;font:700 .78rem 'Lato',sans-serif;text-align:left;background:#fff;color:var(--g-text);border:2px solid var(--g-line);border-radius:10px;padding:5px 7px;cursor:pointer;line-height:1.15;min-height:38px}
.pb canvas{flex-shrink:0;width:24px;height:24px}
.pb small{display:block;font-weight:700;font-size:.66rem;color:var(--g-dim)}
.pb small.ord{color:var(--g-green);padding:0}
.pb:hover:not(:disabled){border-color:var(--g-blue)}
.pb.on{border-color:var(--g-gold);background:#fffbea;box-shadow:0 0 0 3px rgba(244,205,79,.35)}
.pb:disabled{opacity:.38;cursor:default}
.desc{font-size:.82rem;line-height:1.45;color:var(--g-dim);background:#fff;border-left:4px solid var(--g-gold);border-radius:0 10px 10px 0;padding:8px 10px;margin-top:10px}
.desc b{color:var(--g-text)}
.gb{font:900 .82rem 'Lato',sans-serif;letter-spacing:.06em;text-transform:uppercase;background:var(--g-blue);color:#fff;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(31,78,168,.25);transition:transform .12s}
.gb:hover:not(:disabled){transform:translateY(-1px)}
.gb:disabled{opacity:.4;cursor:default}
.gb.alt{background:#fff;color:var(--g-blue);border:2px solid var(--g-blue);box-shadow:none}
.gb.end{width:100%;margin-top:12px;background:var(--g-green)}

.tile{background:var(--g-card);border-radius:12px;padding:8px 11px;box-shadow:var(--g-shadow)}
.tile span{display:block;font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--g-dim)}
.tile b{display:block;font-size:1.3rem;font-weight:900;line-height:1.2}
.tile small{display:block;font-size:.72rem;color:var(--g-dim);line-height:1.3}
.tile b.ok{color:var(--g-green)}.tile b.lo{color:var(--g-red)}.tile b.mid{color:var(--g-amber)}
.meter{height:7px;border-radius:99px;background:#efe7d6;margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.achs{display:flex;flex-wrap:wrap;gap:4px}
.ach{font-size:.68rem;font-weight:700;border-radius:999px;padding:2px 8px;background:#eef1f6;color:#9aa3b5}
.ach.got{background:#fff1c2;color:#7a5a0a}

#modal{position:absolute;inset:0;z-index:20;background:rgba(14,24,52,.55);display:flex;align-items:center;justify-content:center;padding:18px}
#modal .box{background:var(--g-bg);border-radius:18px;max-width:880px;width:100%;max-height:100%;overflow-y:auto;padding:24px 28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:rise .3s ease both}
@keyframes rise{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}
.box h2{font:900 1.65rem 'Lato',sans-serif;margin:0 0 8px;letter-spacing:-.02em}
.box h3{font-size:.62rem;font-weight:900;color:var(--g-blue);margin:18px 0 8px;letter-spacing:.26em;text-transform:uppercase}
.box p{margin:0 0 10px;line-height:1.55}
.eyebrow{font-size:.7rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--g-amber)}
.bigyr{font:900 3rem 'Lato',sans-serif;line-height:1;letter-spacing:-.03em;color:var(--g-text)}
.note{font-size:.93rem;line-height:1.55;background:var(--g-card);border-left:4px solid var(--g-gold);border-radius:0 12px 12px 0;padding:10px 14px;margin:0 0 10px;box-shadow:var(--g-shadow)}
.note.good{border-left-color:var(--g-green)}
.note.bad{border-left-color:var(--g-red);background:#fff8f8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;font-weight:700;background:#fff;border:1px solid var(--g-line);border-radius:999px;padding:3px 10px}
.vis{display:flex;gap:16px;align-items:flex-start}
.vis canvas{flex-shrink:0;width:96px;height:96px;background:#16244d;border-radius:14px}
.copts{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.copt{font:600 .98rem 'Lato',sans-serif;text-align:left;background:var(--g-card);color:var(--g-text);border:2px solid var(--g-line);border-radius:12px;padding:11px 14px;cursor:pointer}
.copt b{display:block;font-weight:900}
.copt small{display:block;color:var(--g-dim);font-size:.85rem;margin-top:2px}
.copt:hover:not(:disabled){border-color:var(--g-blue);background:#f4f7fe}
.copt:disabled{opacity:.45;cursor:default}
.copt.right{border-color:var(--g-green);background:#e9f7ef;color:#14663a}
.copt.wrong{border-color:var(--g-red);background:#fdeeee;color:#9c2b2b}
table.sum{border-collapse:separate;border-spacing:0;width:100%;font-size:.95rem;margin:4px 0 12px;background:var(--g-card);border-radius:14px;overflow:hidden;box-shadow:var(--g-shadow)}
table.sum td,table.sum th{padding:8px 14px;border-bottom:1px solid #eef1f6;text-align:left}
table.sum th{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--g-dim)}
table.sum td.n{text-align:right;white-space:nowrap;font-weight:900}
.pos{color:var(--g-green)}.neg{color:var(--g-red)}
table.sum tr.tot td{background:#fff8e6;color:var(--g-amber);font-weight:900;border-bottom:0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.tl{display:flex;gap:12px;align-items:center;margin:8px 0}
.tl input{flex:1}
#tlCanvas,#chart{width:100%;height:auto;border-radius:10px;box-shadow:var(--g-shadow);background:#fff}
input.txt{font:700 1rem 'Lato',sans-serif;padding:10px 12px;border:2px solid var(--g-line);border-radius:10px;width:min(360px,100%)}
ol.prompts li{margin-bottom:8px}

@media(max-width:1100px){
  .main{grid-template-columns:260px minmax(0,1fr)}
  .stats{grid-column:1/-1;grid-row:1;flex-direction:row;flex-wrap:wrap;border-left:0;border-bottom:1px solid var(--g-line);padding:6px 8px;gap:6px}
  .stats .tile{flex:1 1 110px;padding:5px 8px}
  .stats .tile b{font-size:1rem}
  .stats .tile small,.stats .meter,.stats .achwrap{display:none}
}
@media(max-width:760px){
  .main{grid-template-columns:1fr;grid-template-rows:auto auto auto;overflow-y:auto}
  .mapbox{flex:none}
  .mapwrap{grid-row:2}
  .side{grid-row:3;border-right:0;border-top:1px solid var(--g-line)}
  .stats{grid-row:1}
  .top .ttl small,#shell .tivin-wordmark{display:none}
  #shell .bar{flex-wrap:wrap;gap:8px 12px;padding:8px 12px}
  .maptools .hint{display:none}
  #modal .box{padding:18px}
  .vis{flex-direction:column}
}
</style>

<body>

<div id="shell">
  <div class="bar top">
    <a class="brand" href="./">Tivin Teaches</a>
    <div class="ttl">The Urban Game<small id="topSub">Unit 5 &middot; Industrializing a town, 1750 &ndash; 1900</small></div>
    <div class="hud hidden" id="hud"><span><b id="hudYear">1750</b></span><span>Round <b id="hudRound">1</b>/10</span></div>
    <button type="button" id="fsBtn">&#9974; Full screen</button>
    <a class="nav" href="unit5.html#pg-games">&larr; Unit 5 Games</a>
  </div>
  <div class="main">
    <aside class="side" id="side"></aside>
    <section class="mapwrap">
      <div class="maptools">
        <label><input type="checkbox" id="ovSmoke"> Smoke map</label>
        <label><input type="checkbox" id="ovNet"> Transport links</label>
        <label><input type="checkbox" id="ovHouse"> Living conditions</label>
        <button type="button" class="rotbtn" id="bRot" disabled title="Pick a rectangular building first">&#8635; Rotate building (arrow keys)</button>
        <span class="hint">Click to build &middot; drag for roads, canals, rails &middot; Esc or right-click cancels</span>
      </div>
      <div class="mapbox" id="mapbox"><canvas id="map" width="1024" height="640" aria-label="Town map"></canvas></div>
      <div id="tip" class="hidden"></div>
    </section>
    <aside class="stats" id="stats"></aside>
  </div>
  <div id="modal" class="hidden"><div class="box" id="mbox"></div></div>
</div>

<script>
(function(){
'use strict';
var W = 64, H = 40, T = 16, SAVE = 'u5Urban_v1', BEST = 'u5UrbanBest';
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function store(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
function load(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }

/* ---------- terrain ---------- */
var GR = 0, RIV = 1, SEA = 2, FARM = 3, COMMON = 4, HILL = 5, COAL = 6, SAND = 7;
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function coastX(y){ return 57 + Math.round(2 * Math.sin(y / 5) + Math.sin(y / 2.3) * 0.6); }
var RIVER_PTS = [[0,12],[7,14],[14,13],[21,16],[28,18],[35,19],[41,18],[47,21],[53,20],[64,21]];
function riverY(x){
  for (var i = 0; i < RIVER_PTS.length - 1; i++) {
    var a = RIVER_PTS[i], b = RIVER_PTS[i + 1];
    if (x >= a[0] && x <= b[0]) { var t = (x - a[0]) / (b[0] - a[0]); return Math.round(a[1] + (b[1] - a[1]) * (0.5 - Math.cos(t * Math.PI) / 2)); }
  }
  return 21;
}
var ter = new Uint8Array(W * H), noise = new Float32Array(W * H);
function genTerrain(){
  var r = mulberry(1750);
  for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
    var i = y * W + x, t = GR; noise[i] = r();
    if (x >= coastX(y)) t = SEA; else if (x === coastX(y) - 1) t = SAND;
    else {
      var ry = riverY(x); if (y === ry || y === ry + 1) t = RIV;
      else if ((x >= 1 && x <= 6 && y >= 2 && y <= 9) || (x >= 3 && x <= 14 && y >= 17 && y <= 21 && y > riverY(x) + 2)) t = FARM;
      else if (x >= 4 && x <= 14 && y >= 25 && y <= 32) t = COMMON;
      else if (x >= 35 && x <= 46 && y >= 28 && y <= 38) t = (x >= 38 && x <= 43 && y >= 31 && y <= 35) ? COAL : HILL;
      else if (x >= 1 && x <= 8 && y >= 34 && y <= 39) t = (x >= 2 && x <= 6 && y >= 35 && y <= 38) ? COAL : HILL;
    }
    ter[i] = t;
  }
}
function tAt(x, y){ return (x < 0 || y < 0 || x >= W || y >= H) ? -1 : ter[y * W + x]; }
function isWater(x, y){ var t = tAt(x, y); return t === RIV || t === SEA; }

/* ---------- buildings ---------- */
/* cap = residents, jobs = workers, prod = output, smoke = chimney strength, acc = life bonus to homes within reach */
var B = {
  road:{n:'Road', line:1, r:1, d:'Turnpike roads carried carts, coaches and walking workers. Homes need a road to the works.'},
  canal:{n:'Canal', line:1, r:3, d:'The Bridgewater Canal (1761) halved the price of coal in Manchester. Canals move heavy coal cheaply; link mines and mills to the river.'},
  rail:{n:'Railway', line:1, r:6, d:'The Liverpool and Manchester Railway (1830) was the first steam railway between two cities. Rails carry coal and cloth fast.'},
  lamp:{n:'Street lamps', line:1, r:5, d:'Gas lighting came to English streets from the 1810s. Lit streets felt safer and let shops and works stay open after dark.'},
  cottage:{n:'Cottage', w:2, h:2, r:1, cap:30, life:60, c:'#c9a46a', roof:'#8a6a3a', g:'', d:'Thatched homes of farming families. Many spun and wove wool at home for merchants: the putting-out system.'},
  house:{n:'Terraced houses', w:2, h:2, r:2, cap:60, life:56, c:'#b5563c', roof:'#6e2f22', g:'', d:'Rows of brick terraced houses for mill families, built fast and close together.'},
  tenement:{n:'Tenements', w:3, h:2, r:4, cap:240, life:36, c:'#8f4a3a', roof:'#4d2620', g:'T', d:'Back-to-back housing: many families, shared privies, little light or air. Holds the most people by far.'},
  villa:{n:"Manager's villa", w:3, h:2, r:4, cap:10, life:72, c:'#e8d7b0', roof:'#5a6f8f', g:'', d:'A comfortable house for a mill manager, clerk or engineer: the new middle class.'},
  mansion:{n:'Lavish residence', w:4, h:3, r:6, cap:8, life:86, c:'#f1e6cc', roof:'#3e5a86', g:'R', d:'The mill owner\'s mansion. Owners often built upwind of the smoke, on the west edge of town.'},
  watermill:{n:'Water mill', w:3, h:3, r:2, jobs:120, prod:8, smoke:1, c:'#a98a5a', roof:'#5e4a2c', g:'', river:1, d:'Arkwright\'s water frame (1769) spun strong cotton thread, but needed a fast river to turn the wheel. Must touch the river.'},
  factory:{n:'Steam factory', w:4, h:3, r:3, jobs:240, prod:14, smoke:10, coal:1, c:'#9c3f2f', roof:'#4a2019', g:'F', d:'A steam-powered cotton mill. It can stand anywhere, but it burns coal: link it to a mine by canal or rail. Smoke blows east with the wind.'},
  mine:{n:'Coal mine', w:3, h:3, r:3, jobs:150, prod:6, smoke:5, onCoal:1, c:'#55504a', roof:'#2c2925', g:'M', d:'Coal pits fed every engine. Must sit on a coal seam (the dark speckled hills). The Mines Act (1842) banned women and children under 10 from working underground.'},
  foundry:{n:'Iron foundry', w:4, h:3, r:5, jobs:180, prod:14, smoke:13, coal:1, c:'#6b5b52', roof:'#3a302b', g:'I', d:'Coke-smelted iron for engines, rails and bridges. Coal-hungry and smoky.'},
  steel:{n:'Steel foundry', w:4, h:4, r:9, jobs:330, prod:26, smoke:18, coal:1, c:'#5b6577', roof:'#2c3240', g:'S', d:'Bessemer\'s converter (1856) made cheap steel for rails, ships and bridges: the Second Industrial Revolution.'},
  warehouse:{n:'Warehouse', w:3, h:2, r:3, jobs:45, prod:4, c:'#b98d54', roof:'#6d5130', g:'W', d:'Stores raw cotton and finished cloth. Pays off when linked to the docks by water or rail.'},
  dockyard:{n:'Dockyard', w:4, h:3, r:8, jobs:210, prod:12, smoke:4, onSea:1, c:'#7d8a96', roof:'#3f4a55', g:'D', d:'Builds and repairs iron steamships. Must touch the sea.'},
  shop:{n:'Shop', w:2, h:2, r:1, jobs:9, prod:1, acc:4, c:'#e2c26f', roof:'#8a6d22', g:'S', d:'Grocers, drapers and pawnbrokers. Workers now bought food and cloth instead of making it.'},
  pub:{n:'Pub', w:2, h:2, r:1, jobs:6, acc:3, c:'#c58b3f', roof:'#6b4313', g:'P', d:'The center of working-class social life, and of union meetings. Too many pubs for the population brings drunkenness.'},

function initialItems(){
  var items = [], id = 1;
  function add(t, x, y, w, h){ var b = B[t]; items.push({ id:id++, t:t, x:x, y:y, w:w || b.w || 1, h:h || b.h || 1, born:0 }); }

  var qx = coastX(17) - 3; add('quay', qx, 17);
  [[46,13],[49,13],[46,16],[49,16],[52,13],[47,24]].forEach(function(p){ add('house', p[0], p[1]); });
  add('shop', 51, 16); add('church', 49, 24);
  /* old lane from the village to the port */
  var paths = [[[8,11],[22,11],[29,13],[44,13],[44,15],[qx - 1, 15],[qx - 1, 17]], [[11,5],[11,10]], [[14,7],[14,10]], [[18,5],[18,10]], [[46,23],[52,23]]];
  var seen = {};
  paths.forEach(function(path){
    for (var i = 0; i < path.length - 1; i++) linePts(path[i][0], path[i][1], path[i + 1][0], path[i + 1][1]).forEach(function(p){
      var k = p[0] + ',' + p[1]; if (seen[k]) return; seen[k] = 1; add('road', p[0], p[1], 1, 1); });
  });
  /* forests */
  var r = mulberry(1066), blocked = {};
  items.forEach(function(it){ for (var yy = it.y - 1; yy <= it.y + it.h; yy++) for (var xx = it.x - 1; xx <= it.x + it.w; xx++) blocked[xx + ',' + yy] = 1; });
  function forest(x0, y0, x1, y1, p){
    for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) {
      var t = tAt(x, y); if (t !== GR && t !== HILL && t !== COAL) continue;
      if (blocked[x + ',' + y]) continue;
      var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, dd = Math.hypot((x - cx) / ((x1 - x0) / 2 + 1), (y - cy) / ((y1 - y0) / 2 + 1));
      if (r() < p * (1.15 - dd * 0.75)) { add('tree', x, y, 1, 1); blocked[x + ',' + y] = 1; }

function alive(it){ return !it.died; }
function rebuild(){
  occ.fill(0); byId = {};
  G.items.forEach(function(it){
    byId[it.id] = it; if (it.died) return;
    for (var y = it.y; y < it.y + it.h; y++) for (var x = it.x; x < it.x + it.w; x++) occ[y * W + x] = it.id;
  });
}
function itemAt(x, y){ if (x < 0 || y < 0 || x >= W || y >= H) return null; var id = occ[y * W + x]; return id ? byId[id] : null; }
function linePts(x0, y0, x1, y1){
  var pts = [], dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx - dy;
  while (true) { pts.push([x0, y0]); if (x0 === x1 && y0 === y1) break; var e2 = 2 * err;
    if (e2 > -dy && e2 < dx) { /* step one axis at a time so lines stay 4-connected */ if (Math.abs(err - dy) < Math.abs(err + dx)) { err -= dy; x0 += sx; } else { err += dx; y0 += sy; } }
    else if (e2 > -dy) { err -= dy; x0 += sx; } else { err += dx; y0 += sy; } }
  return pts;
}

/* ---------- rules ---------- */
function unlocked(t){ return B[t] && B[t].r <= G.round + 1; }
function curRound(){ return ROUNDS[G.round]; }
function orderFor(t){ var o = curRound().orders; for (var i = 0; i < o.length; i++) if (o[i].k === 'build' && o[i].b === t) return o[i]; return null; }
function builtThisRound(t){ var n = 0; G.items.forEach(function(it){ if (it.t === t && !it.died && it.born === G.round + 1) n++; }); return n; }
function needsPermit(t){
  var b = B[t]; if (b.line || b.tool) return false;
  var o = orderFor(t); return !(o && builtThisRound(t) < o.n);
}
var rot = 0; /* 1 = the picked building is turned a quarter turn (arrow keys or the Rotate button) */
function canRotate(t){ var b = B[t]; return !!(t && b && !b.line && !b.tool && b.w !== b.h); }
function dims(t){ var b = B[t]; if (b.line || b.tool) return [1, 1]; return rot && b.w !== b.h ? [b.h, b.w] : [b.w, b.h]; }
function footprint(t, x, y){ var d = dims(t); return { x:x, y:y, w:d[0], h:d[1] }; }
/* ---------- limits: each round allows only so many tree clearings, demolitions and lamps (roads, canals and rails are unlimited) ---------- */
var RAIL_OK = /factory|mine|foundry|steel|quay|warehouse|dockyard|watermill/;
function orderN(k, b){ var n = 0; curRound().orders.forEach(function(o){ if (o.k === k && (!b || o.b === b)) n += o.n; }); return n; }
function allowance(k){
  if (k === 'clear') return 6 + orderN('clear');
  if (k === 'demol') return 2 + orderN('demolish');
  if (k === 'lamp') return 2 + orderN('build', 'lamp');
}
function used(k){
  var r = G.round + 1, n = 0;
  if (k === 'clear') return G.cleared[r] || 0;
  if (k === 'demol') { var d = G.demol[r] || {}; for (var t in d) n += d[t]; return n; }
  G.items.forEach(function(it){ if (it.died || it.born !== r) return;
    if (k === 'lamp' && it.t === 'lamp') n++; });
  return n;

    '<h3>Think it over</h3><ol class="prompts"><li>Slide the time-lapse from 1750 to 1890. What did the town gain, and what did it lose?</li><li>Where did the wealthy live in your town, and where did the smoke blow? Why did the West End become the rich side of many British cities?</li><li>Which global connections (American cotton, Indian markets, steamships, foreign visitors) did your town depend on?</li><li>Pick one reform you built (school, hospital, park) or chose (Owen\'s hours, the union). What problem was it answering?</li><li>You had to follow the council\'s orders even when they hurt the town. Who gave those orders in real British towns, and who had no say?</li></ol>' +
    '<div class="row"><button class="gb" id="bAgain">Plan a new town</button><a class="gb alt" href="unit5.html#pg-games" style="text-decoration:none">Back to Unit 5 Games</a></div>');

}
function chart(c){
  var x = c.getContext('2d'), w = c.width, h = c.height, pad = 40, hs = G.hist, LW = 190;
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.font = '700 12px Lato,sans-serif';

  hs.forEach(function(p, i){ x.fillText(i ? p.y : 'Start', pad + i / (hs.length - 1) * (w - LW - pad) - 14, h - 14); });
  [['life','Living','#1a8a4a'],['env','Environment','#7a8a3a'],['ind','Industry','#345fbf'],['crowdP','Housing % full (half)','#cc3d3d']].forEach(function(s, k){
    x.strokeStyle = s[2]; x.lineWidth = 3; x.beginPath();

    x.stroke(); x.fillStyle = s[2]; x.fillRect(w - LW + 14, 30 + k * 22, 12, 12); x.fillStyle = '#16244d'; x.fillText(s[1], w - LW + 32, 40 + k * 22);
  });
}

function drawVisitor(c, kind){

  fig(96, true); x.fillRect(84, 100, 24, 6);
}
